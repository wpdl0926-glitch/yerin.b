<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YERIN.B</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Helvetica', sans-serif;
            background-color: #ffffff;
            background-image: url('background_1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* -------------------------------------------
           카테고리 메뉴 CSS
           ------------------------------------------- */
        .category-menu {
            position: absolute;
            top: calc(10% - 20px);
            left: calc(5% - 20px); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-item {
            font-family: 'Helvetica', sans-serif;
            font-weight: 400; /* Regular */
            font-size: 10pt; 
            letter-spacing: -0.02em; /* -2% */
            color: #000000; /* 기본 검은색 */
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        .category-item:hover {
            color: #FF969D;
        }

        /* 클릭 시(활성화 시) 적용될 색상 */
        .category-item.active {
            color: #FF969D;
        }
        /* ------------------------------------------- */

        /* 투명한 클릭 영역 역할 (yerin.b) */
        .site-brand {
            position: absolute;
            top: calc(10% - 20px);
            right: calc(5% - 20px);
            width: 300px;
            height: 100px;
            z-index: 1000;
            /* background-color: rgba(255, 0, 0, 0.3); */
        }

        /* 로딩 화면 */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 70vw;
            height: 70vw;
            max-width: 800px;
            max-height: 800px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.8;
            will-change: transform;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        .blob-1 { background-color: rgba(150, 175, 215, 0.7); top: -20%; left: -20%; animation-name: moveBlob1; }
        .blob-2 { background-color: rgba(250, 225, 235, 0.8); bottom: -20%; right: -20%; animation-name: moveBlob2; }
        .blob-3 { background-color: rgba(180, 240, 210, 0.7); top: 10%; right: 10%; animation-name: moveBlob3; }
        .blob-4 { background-color: rgba(255, 250, 200, 0.7); bottom: 10%; left: 10%; animation-name: moveBlob4; }

        @keyframes moveBlob1 {
            0% { transform: translate(-30vw, -30vh) scale(1); }
            25% { transform: translate(15vw, 15vh) scale(1.3); }
            50% { transform: translate(30vw, -15vh) scale(1.1); }
            75% { transform: translate(-15vw, 30vh) scale(1.4); }
            100% { transform: translate(-30vw, -30vh) scale(1); }
        }
        @keyframes moveBlob2 {
            0% { transform: translate(30vw, 30vh) scale(1); }
            25% { transform: translate(-15vw, -15vh) scale(1.3); }
            50% { transform: translate(-30vw, 15vh) scale(1.1); }
            75% { transform: translate(15vw, -30vh) scale(1.4); }
            100% { transform: translate(30vw, 30vh) scale(1); }
        }
        @keyframes moveBlob3 {
            0% { transform: translate(15vw, -15vh) scale(1); }
            25% { transform: translate(-30vw, 15vh) scale(1.3); }
            50% { transform: translate(30vw, 30vh) scale(1.1); }
            75% { transform: translate(-15vw, -30vh) scale(1.4); }
            100% { transform: translate(15vw, -15vh) scale(1); }
        }
        @keyframes moveBlob4 {
            0% { transform: translate(-15vw, 15vh) scale(1); }
            25% { transform: translate(30vw, -15vh) scale(1.3); }
            50% { transform: translate(-30vw, -30vh) scale(1.1); }
            75% { transform: translate(15vw, 30vh) scale(1.4); }
            100% { transform: translate(-15vw, 15vh) scale(1); }
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0;
            box-sizing: border-box;
            position: relative;
        }

        .icon-scatter-container {
            position: relative;
            width: 100vw;
            max-width: none;
            height: 100vh;
        }

        .icon-wrapper {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            will-change: transform, left, top;
            /* 애니메이션을 브라우저(CSS)가 처리하도록 수정하여 프레임 드랍(버벅임) 해결 */
            transition: left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        top 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        width 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        height 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .icon-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .icon-front,
        .icon-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .icon-back {
            transform: rotateY(180deg);
        }

        #icon-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1500;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #detail-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1600;
            width: 80vw;
            height: 80vh;
            perspective: 1200px;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        #detail-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        #detail-container.is-flipped #detail-inner {
            transform: rotateY(180deg);
        }

        .detail-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .detail-back {
            transform: rotateY(180deg);
        }

        .detail-face img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
        }

        .butterfly-wrapper {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform;
        }

        .butterfly-wrapper:hover .butterfly-image {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
        }

        .butterfly-bob {
            animation: bobUpAndDown 2.8s ease-in-out infinite alternate;
            will-change: transform;
        }

        .butterfly-image {
            width: 60px;
            height: 60px;
            background-image: url('butterfly.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: flapWings 0.28s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
            transform-origin: 50% 48%;
            transition: filter 0.3s;
            will-change: transform, filter;
        }

        @keyframes bobUpAndDown {
            0% { transform: translate3d(0, -10px, 0) rotate(-2deg); }
            50% { transform: translate3d(3px, 2px, 0) rotate(1deg); }
            100% { transform: translate3d(-2px, 12px, 0) rotate(2deg); }
        }

        @keyframes flapWings {
            0% { transform: perspective(120px) rotateY(-12deg) rotateZ(-3deg) scaleX(0.92) scaleY(1.04); }
            45% { transform: perspective(120px) rotateY(8deg) rotateZ(2deg) scaleX(1.02) scaleY(0.98); }
            100% { transform: perspective(120px) rotateY(18deg) rotateZ(4deg) scaleX(0.86) scaleY(1.05); }
        }

        #camera-widget {
            display: none;
            position: fixed;
            z-index: 2000;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #camera-widget.mini {
            display: block;
            bottom: 30px;
            left: 30px;
            width: 280px;
            height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        #camera-widget.mini:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.8);
        }

        #camera-widget.mini .fullscreen-only {
            display: none !important;
        }

        .mac-green-dot {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #4cd137;
            border-radius: 50%;
            box-shadow: 0 0 8px #4cd137;
            z-index: 10;
        }

        #camera-widget.fullscreen .mac-green-dot {
            display: none;
        }

        #camera-widget.fullscreen {
            display: block;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 0;
            border: none;
        }

        #camera-main-area {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        #camera-widget.fullscreen #camera-main-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: auto;
            align-items: center;
            z-index: 2100;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        #camera-widget.fullscreen #video-container {
            width: min(800px, calc(100vw - 28px));
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        .canvas-container {
            position: absolute !important;
            top: 0;
            left: 0;
            z-index: 2 !important;
        }

        .sticker-palette {
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 10px 15px;
            width: min(800px, calc(100vw - 28px));
            height: 100px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .sticker-palette::-webkit-scrollbar {
            height: 8px;
        }

        .sticker-palette::-webkit-scrollbar-thumb {
            background-color: #cbd1d8;
            border-radius: 10px;
        }

        .sticker-palette img {
            width: 65px;
            height: 65px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .sticker-palette img:hover {
            transform: scale(1.15) rotate(5deg);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: min(800px, calc(100vw - 28px));
            height: 80px;
            margin-top: 5px;
        }

        .btn-delete {
            background-color: transparent;
            border: none;
            cursor: pointer;
            position: absolute;
            left: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: rgba(255, 71, 87, 0.1);
            transform: scale(1.1);
        }

        .btn-delete svg {
            width: 28px;
            height: 28px;
            fill: #747d8c;
            transition: fill 0.2s;
        }

        .btn-delete:hover svg {
            fill: #ff4757;
        }

        .btn-capture {
            background-color: #ff4757;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid #ffeaa7;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-capture:hover {
            background-color: #ff6b81;
            transform: scale(1.08);
        }

        .btn-capture:active {
            transform: scale(0.95);
        }

        .btn-capture svg {
            width: 34px;
            height: 34px;
            fill: white;
        }

        #btn-close-camera {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            z-index: 3010;
        }

        #btn-close-camera:hover {
            background: #ff4757;
            transform: rotate(90deg);
        }

        #temp-canvas {
            visibility: hidden;
            position: absolute;
            top: -9999px;
        }

        /* -------------------------------------------
           About 팝업 CSS
           ------------------------------------------- */
        #about-popup {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #about-popup.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            position: relative;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            perspective: 1000px;
            transform-origin: top center; 
        }

        #about-popup.show .popup-content {
            transform: scale(1);
        }

        .popup-content.folding {
            transform: rotateX(90deg) scale(0.8);
            opacity: 0;
            transition: transform 0.5s ease-in, opacity 0.5s ease-in;
        }

        .popup-body {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .popup-body:hover {
            transform: scale(1.03);
        }

        .popup-body img {
            width: 380px;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
        }

        .popup-close-area {
            position: absolute;
            top: 10%;
            left: 11%;
            width: 12%;
            height: 12%;
            cursor: pointer;
            z-index: 10;
        }

        html,
        body,
        body * {
            cursor: url('cursor-wing.png') 12 7, auto !important;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div id="about-popup">
        <div class="popup-content">
            <div class="popup-close-area" id="popup-close-btn" title="닫기"></div>
            <div class="popup-body" id="popup-body-link" title="About 페이지로 이동">
                <img src="letter.png" alt="About Note">
            </div>
        </div>
    </div>

    <nav class="category-menu">
        <div class="category-item" data-category="album">ALBUM</div>
        <div class="category-item" data-category="year">YEAR</div>
        <div class="category-item" data-category="genre">GENRE</div>
        <div class="category-item" data-category="feature">FEATURE</div>
    </nav>

    <div class="site-brand" id="site-brand" title="메인 배치로 돌아가기"></div>

    <div id="icon-overlay"></div>
    
    <div id="detail-container">
        <div id="detail-inner">
            <div class="detail-face detail-front">
                <img id="detail-image-front" src="" alt="Detail Image Front">
            </div>
            <div class="detail-face detail-back">
                <img id="detail-image-back" src="" alt="Detail Image Back">
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto"></audio>

    <main>
        <div class="icon-scatter-container" id="iconContainer"></div>
    </main>

    <div id="camera-widget">
        <button id="btn-close-camera" class="fullscreen-only" type="button" title="카메라 끄기" aria-label="카메라 끄기">X</button>

        <div id="camera-main-area">
            <div id="video-container">
                <div class="mac-green-dot"></div>
                <video id="video" autoplay playsinline></video>
                <canvas id="overlay-canvas"></canvas>
            </div>

            <div class="sticker-palette fullscreen-only" id="sticker-palette-container"></div>

            <div class="controls fullscreen-only">
                <button class="btn-delete" id="delete-btn" type="button" title="선택된 스티커 삭제" aria-label="선택된 스티커 삭제">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                    </svg>
                </button>
                <button class="btn-capture" id="capture-btn" type="button" title="사진 찍고 저장하기" aria-label="사진 찍고 저장하기">
                    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M4 4h3l2-2h6l2 2h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm8 3a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
                    </svg>
                </button>
            </div>
        </div>

        <canvas id="temp-canvas"></canvas>
    </div>

    <script>
        const select = (selector, root = document) => root.querySelector(selector);
        const byId = (id) => document.getElementById(id);
        const STICKER_COUNT = 60;
        const ICON_SCALE = 1.2;
        const DETAIL_FADE_MS = 300;
        const LOADING_DURATION_MS = 3000;
        const POPUP_FOLD_MS = 500;
        const HIDDEN_POINTER = -1000;
        const ICON_CENTER_LEFT = 50;
        const ICON_CENTER_TOP = 50;
        const ICON_HOVER_RADIUS = 150;
        const ICON_MAX_SCALE_BOOST = 1;
        const ICON_SCALE_SETTLE_RATE = 0.2;
        
        // 프레임 드랍(버벅임) 해결을 위해 JS 위치 계산 개입을 최소화 (0.09 -> 1로 변경)
        const ICON_POSITION_SETTLE_RATE = 1; 
        
        const CAMERA_MAX_WIDTH = 800;
        const CAMERA_SIDE_GAP = 28;
        const CAMERA_LAYOUT_DELAY_MS = 400;
        const stickerAssetVersion = '1779921709408';

        window.addEventListener('load', () => {
            const loadingScreen = byId('loading-screen');
            const aboutPopup = byId('about-popup');
            const popupContent = select('.popup-content');
            const popupCloseBtn = byId('popup-close-btn');
            const popupBodyLink = byId('popup-body-link');

            if (aboutPopup) {
                aboutPopup.classList.add('show');
            }

            // 숨겨져 있던 로딩 화면을 HTML 뼈대(DOM)에서 아예 삭제하여 메모리를 확보합니다.
            if (loadingScreen) {
                setTimeout(() => {
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => {
                        loadingScreen.remove();
                    }, 1200);
                }, LOADING_DURATION_MS);
            }

            if (popupCloseBtn && popupContent && aboutPopup) {
                popupCloseBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    
                    document.dispatchEvent(new CustomEvent('aboutPopupClosed'));
                    popupContent.classList.add('folding');
                    
                    setTimeout(() => {
                        aboutPopup.classList.remove('show');
                    }, POPUP_FOLD_MS);
                });
            }

            if (popupBodyLink) {
                popupBodyLink.addEventListener('click', () => {
                    window.location.href = 'about.html';
                });
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            let isPhotoBoothOpen = false;
            let isDetailOpen = false;
            let isAboutPopupOpen = Boolean(byId('about-popup'));

            const iconOverlay = byId('icon-overlay');
            const detailContainer = byId('detail-container');
            const detailImageFront = byId('detail-image-front');
            const detailImageBack = byId('detail-image-back');
            const bgMusic = byId('bgMusic');

            function stickerUrl(numStr) {
                return `sticker${numStr}.png?v=${stickerAssetVersion}`;
            }

            // 수정된 부분: 확장자를 .mp3로 변경
            function bgMusicUrl(numStr) {
                return `bgm_${numStr}.mp3?v=${stickerAssetVersion}`;
            }

            function playBgMusic(numStr) {
                if (!bgMusic) {
                    return;
                }

                bgMusic.src = bgMusicUrl(numStr);
                bgMusic.currentTime = 0;
                bgMusic.play().catch(err => console.log('Detail music play blocked:', err));
            }

            function stopBgMusic() {
                if (bgMusic) {
                    bgMusic.pause();
                    bgMusic.currentTime = 0;

                    const next = current + (target - current) * rate;
                    return Math.abs(next - target) < epsilon ? target : next;

                function animateIcons() {
                    iconElementsData.forEach(data => {
                        data.cx = (data.currentLeft / 100) * window.innerWidth;
                        data.cy = (data.currentTop / 100) * window.innerHeight;

                        if (isAboutPopupOpen) {

                            data.targetLeft = data.originLeft;
                            data.targetTop = data.originTop;
                            const dx = mouseX - data.cx;
                            const dy = mouseY - data.cy;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            if (distance < ICON_HOVER_RADIUS) {
                                const ratio = 1 - (distance / ICON_HOVER_RADIUS);
                                data.targetScale = 1 + (Math.sin(ratio * Math.PI / 2) * ICON_MAX_SCALE_BOOST);
                            } else {
                                data.targetScale = 1;
                            }
                        }
                        
                        const scaleDiff = Math.abs(data.currentScale - data.targetScale);
                        const leftDiff = Math.abs(data.currentLeft - data.targetLeft);
                        const topDiff = Math.abs(data.currentTop - data.targetTop);

                        if (scaleDiff > 0.001 || leftDiff > 0.01 || topDiff > 0.01) {
                            data.currentScale = settleMotion(data.currentScale, data.targetScale, ICON_SCALE_SETTLE_RATE, 0.001);
                            data.currentLeft = settleMotion(data.currentLeft, data.targetLeft, ICON_POSITION_SETTLE_RATE, 0.01);

                    if (!cameraStreamActive) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: {
                                    width: { ideal: 1280 },
                                    height: { ideal: 720 }
                                },
                                audio: false
                            });
                            video.srcObject = stream;
                            cameraStreamActive = true;
                        } catch (err) {
                            alert('카메라 접근 권한이 필요합니다.');
                            return;
                        }
                    }
                    cameraWidget.style.display = 'block';
                    setTimeout(() => cameraWidget.className = 'mini', 10);
                });

                let bX = window.innerWidth / 2;
                let bY = window.innerHeight / 2;
                let bRot = 45;
                let velocityX = 0.35;
                let velocityY = -0.2;
                let targetX = bX;
                let targetY = bY;
                let lastFlutterTurn = 0;

                function chooseButterflyTarget() {
                    const margin = 70;
                    targetX = Math.random() * (window.innerWidth - margin * 2) + margin;
                    targetY = Math.random() * (window.innerHeight - margin * 2) + margin;
                }

                function angleDifference(target, current) {
                    let diff = target - (current % 360);
                    if (diff > 180) diff -= 360;
                    if (diff < -180) diff += 360;
                    return diff;
                }

                function animateButterfly(time = 0) {
                    if (time - lastFlutterTurn > 2600 || Math.hypot(targetX - bX, targetY - bY) < 110) {
                        chooseButterflyTarget();
                        lastFlutterTurn = time;
                    }

                    const dx = targetX - bX;
                    const dy = targetY - bY;
                    const distance = Math.max(1, Math.hypot(dx, dy));
                    const drift = 0.014;
                    const lift = Math.sin(time / 520) * 0.035;

                    velocityX += (dx / distance) * drift + Math.cos(time / 900) * 0.01;
                    velocityY += (dy / distance) * drift + lift;

                    const speed = Math.hypot(velocityX, velocityY);
                    const maxSpeed = 1.55;
                    if (speed > maxSpeed) {
                        velocityX = (velocityX / speed) * maxSpeed;
                        velocityY = (velocityY / speed) * maxSpeed;
                    }

                    bX += velocityX;
                    bY += velocityY;

                    const margin = 42;
                    if (bX < margin || bX > window.innerWidth - margin) {
                        velocityX *= -0.75;
                        bX = Math.max(margin, Math.min(window.innerWidth - margin, bX));
                        chooseButterflyTarget();
                    }
                    if (bY < margin || bY > window.innerHeight - margin) {
                        velocityY *= -0.75;
                        bY = Math.max(margin, Math.min(window.innerHeight - margin, bY));
                        chooseButterflyTarget();
                    }

                    const targetRotation = Math.atan2(velocityY, velocityX) * (180 / Math.PI) + 90;
                    bRot += angleDifference(targetRotation, bRot) * 0.08;
                    const sway = Math.sin(time / 230) * 5;

                    wrapper.style.transform = `translate3d(${bX.toFixed(2)}px, ${bY.toFixed(2)}px, 0) rotate(${(bRot + sway).toFixed(2)}deg)`;
                    requestAnimationFrame(animateButterfly);
                }

                chooseButterflyTarget();
                requestAnimationFrame(animateButterfly);
            }
            createSingleButterfly();

            videoContainer.addEventListener('click', (e) => {
                if (cameraWidget.classList.contains('mini')) {
                    e.stopPropagation();

                    if (typeof fabric === 'undefined') {
                        alert('스티커 편집 기능을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
                        return;
                    }

                    cameraWidget.className = 'fullscreen';
                    isPhotoBoothOpen = true;

                    setTimeout(() => {
                        const ratio = video.videoHeight && video.videoWidth ? video.videoHeight / video.videoWidth : 9 / 16;
                        const displayWidth = Math.min(CAMERA_MAX_WIDTH, window.innerWidth - CAMERA_SIDE_GAP);
                        const displayHeight = displayWidth * ratio;

                        videoContainer.style.height = displayHeight + 'px';

                        if (!fabricCanvas) {
                            fabricCanvas = new fabric.Canvas('overlay-canvas');
                        }
                        fabricCanvas.setWidth(displayWidth);
                        fabricCanvas.setHeight(displayHeight);
                    }, CAMERA_LAYOUT_DELAY_MS);
                }
            });

            byId('btn-close-camera').addEventListener('click', (e) => {
                e.stopPropagation();
                cameraWidget.style.display = 'none';
                cameraWidget.className = '';
                isPhotoBoothOpen = false;

                videoContainer.style.height = '100%';

                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }
                cameraStreamActive = false;
                if (fabricCanvas) fabricCanvas.clear();
            });

            window.addSticker = function(imgId) {
                if (!fabricCanvas) return;
                const imgElement = byId(imgId);
                if (!imgElement) return;

                const imgInstance = new fabric.Image(imgElement, {
                    left: fabricCanvas.width / 2,
                    top: fabricCanvas.height / 2,
                    originX: 'center',
                    originY: 'center',
                    scaleX: 0.5,
                    scaleY: 0.5,
                    transparentCorners: false,
                    cornerColor: '#111',
                    cornerStrokeColor: '#fff',
                    borderColor: '#111',
                    cornerSize: 12,
                    padding: 10,
                    cornerStyle: 'circle'
                });
                fabricCanvas.add(imgInstance);
                fabricCanvas.setActiveObject(imgInstance);
            };

            function removeActiveSticker({ showEmptyMessage = false } = {}) {
                if (!fabricCanvas) {
                    return;
                }

                const activeObject = fabricCanvas.getActiveObject();
                if (activeObject) {
                    fabricCanvas.remove(activeObject);
                } else if (showEmptyMessage) {
                    alert('삭제할 스티커를 먼저 클릭해서 선택해주세요.');
                }
            }

            function showCaptureFlash() {
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.inset = '0';
                flash.style.backgroundColor = 'white';
                flash.style.zIndex = '9999';
                flash.style.pointerEvents = 'none';
                document.body.appendChild(flash);

                setTimeout(() => {
                    flash.style.transition = 'opacity 0.4s ease-out';
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 400);
                }, 50);
            }

            function downloadImage(dataUrl, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                link.remove();
            }

            byId('delete-btn').addEventListener('click', function() {
                removeActiveSticker({ showEmptyMessage: true });
            });

            window.addEventListener('keydown', function(e) {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    removeActiveSticker();
                }
            });

            byId('capture-btn').addEventListener('click', function() {
                if (!fabricCanvas) return;
                fabricCanvas.discardActiveObject();
                fabricCanvas.renderAll();

                showCaptureFlash();

                try {
                    const ctx = tempCanvas.getContext('2d');
                    tempCanvas.width = fabricCanvas.width;
                    tempCanvas.height = fabricCanvas.height;

                    ctx.save();
                    ctx.translate(tempCanvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                    ctx.restore();

                    const fabricEl = fabricCanvas.lowerCanvasEl || fabricCanvas.getElement();
                    ctx.drawImage(fabricEl, 0, 0, tempCanvas.width, tempCanvas.height);

                    downloadImage(tempCanvas.toDataURL('image/png'), 'YerinB_Photo.png');
                } catch (e) {
                    console.error('저장 에러:', e);
                    alert('사진을 저장할 수 없습니다. 브라우저 보안 정책 때문에 차단될 수 있으니 localhost 또는 GitHub Pages에서 열어주세요.');
                }
            });
        });
    </script>
</body>
</html>
