<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YERIN.B</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Helvetica', sans-serif;
            background-color: #ffffff;
            background-image: url('background_1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('background_2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 0;
        }

        body.logo-hover::before {
            opacity: 1;
        }

        body:has(.site-brand:hover)::before {
            opacity: 1;
        }

        /* -------------------------------------------
           카테고리 메뉴 CSS
           ------------------------------------------- */
        .category-menu {
            position: absolute;
            top: calc(10% - 20px);
            left: calc(5% - 20px); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-item {
            font-family: 'Helvetica', sans-serif;
            font-weight: 400; /* Regular */
            font-size: 10pt; 
            letter-spacing: -0.02em; /* -2% */
            color: #000000; /* 기본 검은색 */
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        .category-item:hover {
            color: #000000;
        }

        /* 클릭 시(활성화 시) 적용될 색상 */
        .category-item.active {
            color: #FF969D;
        }

        .search-panel {
            display: flex;
            align-items: center;
            width: 150px;
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
            transition: max-height 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
            overflow: hidden;
        }

        .search-panel.open {
            max-height: 34px;
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .search-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #000000;
            background: transparent;
            padding: 4px 0;
            font-family: 'Helvetica', sans-serif;
            font-size: 10pt;
            color: #000000;
            outline: none;
            text-transform: lowercase;
        }

        .search-input::placeholder {
            color: rgba(0, 0, 0, 0.35);
        }
        /* ------------------------------------------- */

        /* 투명한 클릭 영역 역할 (yerin.b) */
        .site-brand {
            position: absolute;
            top: 6%;
            right: 4%;
            width: 16%;
            height: 7%;
            z-index: 1000;
        }

        /* 로딩 화면 */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 70vw;
            height: 70vw;
            max-width: 800px;
            max-height: 800px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.8;
            will-change: transform;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        .blob-1 { background-color: rgba(150, 175, 215, 0.7); top: -20%; left: -20%; animation-name: moveBlob1; }
        .blob-2 { background-color: rgba(250, 225, 235, 0.8); bottom: -20%; right: -20%; animation-name: moveBlob2; }
        .blob-3 { background-color: rgba(180, 240, 210, 0.7); top: 10%; right: 10%; animation-name: moveBlob3; }
        .blob-4 { background-color: rgba(255, 250, 200, 0.7); bottom: 10%; left: 10%; animation-name: moveBlob4; }

        @keyframes moveBlob1 {
            0% { transform: translate(-30vw, -30vh) scale(1); }
            25% { transform: translate(15vw, 15vh) scale(1.3); }
            50% { transform: translate(30vw, -15vh) scale(1.1); }
            75% { transform: translate(-15vw, 30vh) scale(1.4); }
            100% { transform: translate(-30vw, -30vh) scale(1); }
        }
        @keyframes moveBlob2 {
            0% { transform: translate(30vw, 30vh) scale(1); }
            25% { transform: translate(-15vw, -15vh) scale(1.3); }
            50% { transform: translate(-30vw, 15vh) scale(1.1); }
            75% { transform: translate(15vw, -30vh) scale(1.4); }
            100% { transform: translate(30vw, 30vh) scale(1); }
        }
        @keyframes moveBlob3 {
            0% { transform: translate(15vw, -15vh) scale(1); }
            25% { transform: translate(-30vw, 15vh) scale(1.3); }
            50% { transform: translate(30vw, 30vh) scale(1.1); }
            75% { transform: translate(-15vw, -30vh) scale(1.4); }
            100% { transform: translate(15vw, -15vh) scale(1); }
        }
        @keyframes moveBlob4 {
            0% { transform: translate(-15vw, 15vh) scale(1); }
            25% { transform: translate(30vw, -15vh) scale(1.3); }
            50% { transform: translate(-30vw, -30vh) scale(1.1); }
            75% { transform: translate(15vw, 30vh) scale(1.4); }
            100% { transform: translate(-15vw, 15vh) scale(1); }
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 0;
            box-sizing: border-box;
            position: relative;
        }

        .icon-scatter-container {
            position: relative;
            width: 100vw;
            max-width: none;
            height: 100vh;
        }

        .icon-wrapper {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            will-change: transform, left, top;
            transition: left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        top 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        width 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        filter 0.25s ease;
        }

        .icon-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .year-label {
            display: none;
            position: absolute;
            left: 50%;
            bottom: calc(100% + 3px);
            transform: translateX(-50%);
            font-family: 'Pretendard', 'Helvetica', sans-serif;
            font-weight: 500;
            font-size: 7pt;
            line-height: 1;
            letter-spacing: 0;
            color: #000000;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .icon-wrapper.show-year-label .year-label {
            display: block;
        }

        .album-center-indicator {
            position: fixed;
            left: 50%;
            top: 56%;
            z-index: 35;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -100%);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        .album-center-indicator.show {
            opacity: 1;
        }

        .album-center-name {
            min-width: 120px;
            margin-bottom: 7px;
            font-family: 'Pretendard', 'Helvetica', sans-serif;
            font-weight: 500;
            font-size: 7pt;
            line-height: 1;
            letter-spacing: 0;
            color: #000000;
            text-align: center;
            white-space: nowrap;
        }

        .album-center-triangle {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 7px solid #000000;
        }

        #preference-float {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 950;
            font-family: 'Pretendard', 'Helvetica', sans-serif;
            font-weight: 500;
            font-size: 6pt;
            line-height: 160%;
            letter-spacing: 0;
            color: #000000;
            white-space: nowrap;
            text-align: center;
            opacity: 0;
            filter: blur(3px);
            transform: translate3d(0, 12px, 0) scale(0.98);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            pointer-events: none;
            user-select: none;
            will-change: opacity, transform, filter;
        }

        #preference-float.show {
            opacity: 1;
            filter: blur(0);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .icon-front,
        .icon-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .icon-back {
            transform: rotateY(180deg);
        }

        #icon-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1500;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #detail-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1600;
            width: 80vw;
            height: 80vh;
            perspective: 1200px;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        #detail-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        #detail-container.is-flipped #detail-inner {
            transform: rotateY(180deg);
        }

        .detail-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .detail-back {
            transform: rotateY(180deg);
        }

        .detail-face img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
            transform: scale(var(--detail-scale, 1));
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .butterfly-wrapper {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform;
        }

        .butterfly-wrapper:hover .butterfly-image {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
        }

        .butterfly-bob {
            animation: bobUpAndDown 2.8s ease-in-out infinite alternate;
            will-change: transform;
        }

        .butterfly-image {
            width: 60px;
            height: 60px;
            background-image: url('butterfly.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: flapWings 0.28s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
            transform-origin: 50% 48%;
            transition: filter 0.3s;
            will-change: transform, filter;
        }

        @keyframes bobUpAndDown {
            0% { transform: translate3d(0, -10px, 0) rotate(-2deg); }
            50% { transform: translate3d(3px, 2px, 0) rotate(1deg); }
            100% { transform: translate3d(-2px, 12px, 0) rotate(2deg); }
        }

        @keyframes flapWings {
            0% { transform: perspective(120px) rotateY(-12deg) rotateZ(-3deg) scaleX(0.92) scaleY(1.04); }
            45% { transform: perspective(120px) rotateY(8deg) rotateZ(2deg) scaleX(1.02) scaleY(0.98); }
            100% { transform: perspective(120px) rotateY(18deg) rotateZ(4deg) scaleX(0.86) scaleY(1.05); }
        }

        #camera-widget {
            display: none;
            position: fixed;
            z-index: 2000;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #camera-widget.mini {
            display: block;
            bottom: 30px;
            left: 30px;
            width: 280px;
            height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        #camera-widget.mini:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.8);
        }

        #camera-widget.mini .fullscreen-only {
            display: none !important;
        }

        .mac-green-dot {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #4cd137;
            border-radius: 50%;
            box-shadow: 0 0 8px #4cd137;
            z-index: 10;
        }

        #camera-widget.fullscreen .mac-green-dot {
            display: none;
        }

        #camera-widget.fullscreen {
            display: block;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 0;
            border: none;
        }

        #camera-main-area {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        #camera-widget.fullscreen #camera-main-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: auto;
            align-items: center;
            z-index: 2100;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        #camera-widget.fullscreen #video-container {
            width: min(800px, calc(100vw - 28px));
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        .canvas-container {
            position: absolute !important;
            top: 0;
            left: 0;
            z-index: 2 !important;
        }

        .sticker-palette {
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 10px 15px;
            width: min(800px, calc(100vw - 28px));
            height: 100px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .sticker-palette::-webkit-scrollbar {
            height: 8px;
        }

        .sticker-palette::-webkit-scrollbar-thumb {
            background-color: #cbd1d8;
            border-radius: 10px;
        }

        .sticker-palette img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .sticker-palette img:hover {
            transform: scale(1.15) rotate(5deg);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: min(800px, calc(100vw - 28px));
            height: 80px;
            margin-top: 5px;
        }

        .btn-delete {
            background-color: transparent;
            border: none;
            cursor: pointer;
            position: absolute;
            left: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: rgba(255, 71, 87, 0.1);
            transform: scale(1.1);
        }

        .btn-delete svg {
            width: 28px;
            height: 28px;
            fill: #747d8c;
            transition: fill 0.2s;
        }

        .btn-delete:hover svg {
            fill: #ff4757;
        }

        .btn-capture {
            background-color: #ff4757;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid #ffeaa7;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-capture:hover {
            background-color: #ff6b81;
            transform: scale(1.08);
        }

        .btn-capture:active {
            transform: scale(0.95);
        }

        .btn-capture svg {
            width: 34px;
            height: 34px;
            fill: white;
        }

        #btn-close-camera {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            z-index: 3010;
        }

        #btn-close-camera:hover {
            background: #ff4757;
            transform: rotate(90deg);
        }

        #temp-canvas {
            visibility: hidden;
            position: absolute;
            top: -9999px;
        }

        /* -------------------------------------------
           About 팝업 CSS
           ------------------------------------------- */
        #about-popup {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #about-popup.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            position: relative;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            perspective: 1000px;
            transform-origin: top center; 
        }

        #about-popup.show .popup-content {
            transform: scale(1);
        }

        .popup-content.folding {
            transform: rotateX(90deg) scale(0.8);
            opacity: 0;
            transition: transform 0.5s ease-in, opacity 0.5s ease-in;
        }

        .popup-body {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .popup-body:hover {
            transform: scale(1.03);
        }

        .popup-body img {
            width: 380px;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
        }

        .popup-close-area {
            position: absolute;
            top: 10%;
            left: 11%;
            width: 12%;
            height: 12%;
            cursor: pointer;
            z-index: 10;
        }

        html,
        body,
        body * {
            cursor: url('cursor-wing.png') 12 7, auto !important;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div id="about-popup">
        <div class="popup-content">
            <div class="popup-close-area" id="popup-close-btn" title="닫기"></div>
            <div class="popup-body" id="popup-body-link" title="About 페이지로 이동">
                <img src="letter.png" alt="About Note">
            </div>
        </div>
    </div>

    <nav class="category-menu">
        <div class="category-item" data-category="album">ALBUM</div>
        <div class="category-item" data-category="year">YEAR</div>
        <div class="category-item" data-category="genre">GENRE</div>
        <div class="category-item" data-category="feature">FEATURE</div>
        <div class="category-item search-toggle" id="search-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="search-panel">SEARCH</div>
        <div class="search-panel" id="search-panel">
            <input class="search-input" id="search-input" type="search" placeholder="search" autocomplete="off" aria-label="Search stickers">
        </div>
    </nav>

    <div class="site-brand" id="site-brand" title="메인 배치로 돌아가기"></div>
    <div id="preference-float" aria-hidden="true"></div>

    <div id="icon-overlay"></div>
    
    <div id="detail-container">
        <div id="detail-inner">
            <div class="detail-face detail-front">
                <img id="detail-image-front" src="" alt="Detail Image Front">
            </div>
            <div class="detail-face detail-back">
                <img id="detail-image-back" src="" alt="Detail Image Back">
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop preload="auto"></audio>

    <main>
        <div class="album-center-indicator" id="album-center-indicator" aria-hidden="true">
            <div class="album-center-name" id="album-center-name"></div>
            <div class="album-center-triangle"></div>
        </div>
        <div class="icon-scatter-container" id="iconContainer"></div>
    </main>

    <div id="camera-widget">
        <button id="btn-close-camera" class="fullscreen-only" type="button" title="카메라 끄기" aria-label="카메라 끄기">X</button>

        <div id="camera-main-area">
            <div id="video-container">
                <div class="mac-green-dot"></div>
                <video id="video" autoplay playsinline></video>
                <canvas id="overlay-canvas"></canvas>
            </div>

            <div class="sticker-palette fullscreen-only" id="sticker-palette-container"></div>

            <div class="controls fullscreen-only">

                const layout = Array.from({ length: STICKER_COUNT });

                const albumInnerRadius = 8;

                    const sourceLeft = group.axisLeft ?? 50 + Math.cos((-90 + 360 * progress) * (Math.PI / 180)) * 38;

                    const axisAngle = Math.atan2(sourceTop - 50, sourceLeft - 50);
                    const count = group.stickers.length;
                    const axisLeft = 50 + Math.cos(axisAngle) * ALBUM_RING_VERTICAL_RADIUS * aspectAdjustedX;

                    const groupRotation = rotationFacingCenter(axisLeft, axisTop);

                    group.stickers.forEach((numStr, itemIndex) => {
                        const radius = count > 1
                            ? albumInnerRadius + ((ALBUM_RING_VERTICAL_RADIUS - albumInnerRadius) * itemIndex / (count - 1))

                        const left = 50 + Math.cos(axisAngle) * radius * aspectAdjustedX;
                        const top = 50 + Math.sin(axisAngle) * radius;
                        layout[parseInt(numStr, 10) - 1] = {
                            left: left.toFixed(2),
                            top: top.toFixed(2),
                            size: albumIconSize,
                            rotation: groupRotation
                        };
                    });
                });

                    return ALBUM_DISPLAY_PIVOT_LEFT + (baseLeft - pivotLeft) * ALBUM_LAYOUT_DISPLAY_SCALE;
                }
                if (category !== 'feature') return left;
                return clamp(50 + (left - 50) * FEATURE_HORIZONTAL_SPREAD, 6, 94);
            }

            function getIconTop(layoutItem, category = 'main') {
                const top = parseFloat(layoutItem.top);
                if (category === 'album') {
                    const baseTop = getAlbumViewportBaseTop(top);
                    const pivotTop = getAlbumViewportBaseTop(ALBUM_SOURCE_PIVOT_TOP);
                    return ALBUM_DISPLAY_PIVOT_TOP + (baseTop - pivotTop) * ALBUM_LAYOUT_DISPLAY_SCALE;
                }
                if (category !== 'feature') return top;
                return clamp(50 + (top - 50) * FEATURE_VERTICAL_SPREAD, 6, 94);
            }

            function getIconRotation(layoutItem, category = 'main', index = 0) {
                if (category === 'album') {
                    return rotationFacingViewportPoint(
                        getIconLeft(layoutItem, category),
                        getIconTop(layoutItem, category),
                        ALBUM_ROTATION_TARGET_LEFT,
                        ALBUM_ROTATION_TARGET_TOP
                    );
                }
                return layoutItem.rotation || 0;
            }

            function getYearLabelStickers(layout) {
                const labelStickerByYear = layout.reduce((map, layoutItem, index) => {
                    const year = layoutItem.year;
                    if (!year) return map;
                    const current = map[year];
                    const top = parseFloat(layoutItem.top);
                    if (!current || top < current.top) {
                        map[year] = {
                            sticker: (index + 1).toString().padStart(2, '0'),
                            top
                        };
                    }
                    return map;
                }, {});

                return Object.values(labelStickerByYear).reduce((set, item) => {
                    set.add(item.sticker);
                    return set;
                }, new Set());
            }

            let yearLabelRevealTimer = null;

            function clearYearLabelRevealTimer() {
                if (yearLabelRevealTimer) {
                    clearTimeout(yearLabelRevealTimer);
                    yearLabelRevealTimer = null;
                }
            }

            function hideAllYearLabels() {
                iconElementsData.forEach(data => {
                    data.element.classList.remove('show-year-label');
                    if (data.yearLabel) {
                        data.yearLabel.textContent = '';
                    }
                });
            }

            function showSettledYearLabels(targetLayout, yearLabelStickers) {
                iconElementsData.forEach((data, index) => {
                    if (!targetLayout[index]) return;
                    const numStr = (index + 1).toString().padStart(2, '0');
                    const shouldShowYearLabel = yearLabelStickers.has(numStr);
                    data.element.classList.toggle('show-year-label', shouldShowYearLabel);
                    if (data.yearLabel) {
                        data.yearLabel.textContent = shouldShowYearLabel ? String(targetLayout[index].year || '') : '';
                    }
                });
            }

            function applyLayout(category) {
                const targetLayout = resolveLayout(category);
                if (!targetLayout) return;
                activeCategory = category;
                const yearLabelStickers = category === 'year' ? getYearLabelStickers(targetLayout) : new Set();
                clearYearLabelRevealTimer();
                hideAllYearLabels();

                iconElementsData.forEach((data, index) => {
                    if (targetLayout[index]) {
                        const baseLeft = getIconLeft(targetLayout[index], category);
                        const baseTop = getIconTop(targetLayout[index], category);
                        const baseRotation = getIconRotation(targetLayout[index], category, index);
                        data.layoutBaseLeft = baseLeft;
                        data.layoutBaseTop = baseTop;
                        data.layoutBaseRotation = baseRotation;
                        if (category === 'album') {
                            setAlbumRotatedOrigin(data, baseLeft, baseTop, baseRotation);
                        } else {
                            data.originLeft = baseLeft;
                            data.originTop = baseTop;
                            data.originRotation = baseRotation;
                        }
                        const newSize = getIconSize(targetLayout[index], category);
                        data.element.style.width = `${newSize}px`;
                        data.element.style.height = `${newSize}px`;
                    }
                });

                if (category === 'year') {
                    yearLabelRevealTimer = setTimeout(() => {
                        showSettledYearLabels(targetLayout, yearLabelStickers);
                        yearLabelRevealTimer = null;
                    }, YEAR_LABEL_REVEAL_DELAY_MS);
                }

                if (category === 'album') {
                    updateAlbumCenterName();
                } else {
                    hideAlbumCenterIndicator();
                }
            }

            function rotateAlbumSet(deltaDegrees) {
                if (activeCategory !== 'album') return;
                albumSetRotation = normalizeRotation(albumSetRotation + deltaDegrees);
                iconElementsData.forEach(data => {
                    if (
                        Number.isFinite(data.layoutBaseLeft) &&
                        Number.isFinite(data.layoutBaseTop) &&
                        Number.isFinite(data.layoutBaseRotation)
                    ) {
                        setAlbumRotatedOrigin(
                            data,
                            data.layoutBaseLeft,
                            data.layoutBaseTop,
                            data.layoutBaseRotation
                        );
                    }
                });
                updateAlbumCenterName();
            }

            function hideAlbumCenterIndicator() {
                if (!albumCenterIndicator) return;
                albumCenterIndicator.classList.remove('show');
            }

            function getAlbumGroupDisplayAngle(group) {
                const vectors = group.stickers
                    .map(numStr => iconElementsData[parseInt(numStr, 10) - 1])
                    .filter(data => (
                        data &&
                        Number.isFinite(data.originLeft) &&
                        Number.isFinite(data.originTop)
                    ))
                    .map(data => ({
                        x: ((data.originLeft - ALBUM_DISPLAY_PIVOT_LEFT) / 100) * window.innerWidth,
                        y: ((data.originTop - ALBUM_DISPLAY_PIVOT_TOP) / 100) * window.innerHeight
                    }));

                if (!vectors.length) return null;

                const vector = vectors.reduce((sum, item) => ({
                    x: sum.x + item.x,
                    y: sum.y + item.y
                }), { x: 0, y: 0 });

                return Math.atan2(vector.y / vectors.length, vector.x / vectors.length) * (180 / Math.PI);
            }

            function updateAlbumCenterName() {
                if (!albumCenterIndicator || !albumCenterName) return;
                if (activeCategory !== 'album') {
                    hideAlbumCenterIndicator();
                    return;
                }

                const activeGroup = albumGroups.reduce((best, group) => {
                    const angle = getAlbumGroupDisplayAngle(group);
                    if (!Number.isFinite(angle)) return best;
                    const diff = Math.abs(shortestAngleDiff(angle, ALBUM_NAME_TARGET_ANGLE));
                    if (!best || diff < best.diff) {
                        return { group, diff };
                    }
                    return best;
                }, null);

                if (!activeGroup) {
                    hideAlbumCenterIndicator();
                    return;
                }

                albumCenterName.textContent = activeGroup.group.name;
                albumCenterIndicator.classList.add('show');
            }

            const currentLayout = resolveLayout('main');

            if (container) {
                for (let i = 0; i < currentLayout.length; i++) {
                    const numStr = (i + 1).toString().padStart(2, '0');
                    const oLeft = parseFloat(currentLayout[i].left);
                    const oTop = parseFloat(currentLayout[i].top);
                    const oSize = getIconSize(currentLayout[i], 'main');

                    const iconWrapper = document.createElement('div');
                    iconWrapper.classList.add('icon-wrapper');
                    iconWrapper.dataset.sticker = numStr;
                    iconWrapper.setAttribute('aria-label', `sticker${numStr}`);
                    iconWrapper.style.width = `${oSize}px`;
                    iconWrapper.style.height = `${oSize}px`;
                    iconWrapper.style.left = `${ICON_CENTER_LEFT}%`;
                    iconWrapper.style.top = `${ICON_CENTER_TOP}%`;
                    iconWrapper.style.transform = `translate3d(-50%, -50%, 0) scale(1)`;

                    const iconInner = document.createElement('div');
                    iconInner.classList.add('icon-inner');

                    const frontFace = document.createElement('div');
                    frontFace.classList.add('icon-front');
                    frontFace.style.backgroundImage = `url('${stickerUrl(numStr)}')`;

                    const backFace = document.createElement('div');
                    backFace.classList.add('icon-back');
                    backFace.style.backgroundImage = `url('${stickerUrl(numStr)}')`;

                    iconInner.appendChild(frontFace);
                    iconInner.appendChild(backFace);
                    iconWrapper.appendChild(iconInner);

                    const yearLabel = document.createElement('div');
                    yearLabel.classList.add('year-label');
                    iconWrapper.appendChild(yearLabel);

                    container.appendChild(iconWrapper);

                    const dataObj = {
                        element: iconWrapper,
                        yearLabel,
                        originLeft: oLeft,
                        originTop: oTop,
                        layoutBaseLeft: oLeft,
                        layoutBaseTop: oTop,
                        layoutBaseRotation: 0,
                        currentLeft: ICON_CENTER_LEFT,
                        currentTop: ICON_CENTER_TOP,
                        targetLeft: ICON_CENTER_LEFT,
                        targetTop: ICON_CENTER_TOP,
                        originRotation: 0,
                        currentRotation: 0,
                        targetRotation: 0,
                        currentScale: 1,
                        targetScale: 1,
                        sticker: numStr,
                        preferenceScore: preferenceScoreBySticker[numStr] || 1,
                        visibleTopRatio: stickerVisibleTopRatioBySticker[numStr] || 0,
                        searchTerms: [
                            numStr,
                            String(i + 1),
                            `sticker${numStr}`,
                            `detail${numStr}`,
                            `bgm${numStr}`,
                            `bgm_${numStr}`,
                            ...(songSearchTermsBySticker[numStr] || [])
                        ],
                        cx: 0,
                        cy: 0
                    };
                    iconElementsData.push(dataObj);

                    iconWrapper.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (!isDetailOpen) openDetailView(numStr);
                    });
                }

                const menuItems = document.querySelectorAll('.category-item[data-category]');
                const searchToggle = byId('search-toggle');
                const searchPanel = byId('search-panel');
                const searchInput = byId('search-input');

                function normalizeSearchValue(value) {
                    return String(value)
                        .trim()
                        .toLowerCase()
                        .normalize('NFKC')
                        .replace(/[\s'’"“”.,!?\-_/()[\]:;]+/g, '');
                }

                function applySearchFilter(value) {
                    const query = normalizeSearchValue(value);
                    iconElementsData.forEach(data => {
                        const isMatch = !query || data.searchTerms.some(term => normalizeSearchValue(term).includes(query));
                        data.element.style.opacity = isMatch ? '1' : '0.12';
                        data.element.style.pointerEvents = isMatch ? 'auto' : 'none';
                        data.element.style.filter = isMatch ? '' : 'grayscale(1)';
                    });
                }

                function setSearchOpen(isOpen, { clear = false } = {}) {
                    if (!searchToggle || !searchPanel || !searchInput) return;

                    searchPanel.classList.toggle('open', isOpen);
                    searchToggle.classList.toggle('active', isOpen);
                    searchToggle.setAttribute('aria-expanded', String(isOpen));

                    if (clear) {
                        searchInput.value = '';
                        applySearchFilter('');
                    }

                    if (isOpen) {
                        searchInput.focus();
                    }
                }

                if (searchToggle && searchPanel && searchInput) {
                    searchToggle.addEventListener('click', () => {
                        const shouldOpen = !searchPanel.classList.contains('open');
                        menuItems.forEach(el => el.classList.remove('active'));
                        setSearchOpen(shouldOpen, { clear: !shouldOpen });
                    });

                    searchToggle.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' || e.key === ' ') {
                            e.preventDefault();
                            searchToggle.click();
                        }
                    });

                    searchInput.addEventListener('input', (e) => {
                        applySearchFilter(e.target.value);
                    });

                    searchInput.addEventListener('keydown', (e) => {
                        if (e.key === 'Escape') {
                            setSearchOpen(false, { clear: true });
                            searchToggle.focus();
                        }
                    });
                }

                menuItems.forEach(item => {
                    item.addEventListener('click', (e) => {
                        menuItems.forEach(el => el.classList.remove('active'));
                        e.target.classList.add('active');
                        setSearchOpen(false, { clear: true });
                        const selectedCategory = e.target.getAttribute('data-category');
                        applyLayout(selectedCategory);
                    });
                });

                const siteBrand = byId('site-brand');
                if (siteBrand) {
                    siteBrand.addEventListener('mouseenter', () => {
                        document.body.classList.add('logo-hover');
                    });

                    siteBrand.addEventListener('mouseleave', () => {
                        document.body.classList.remove('logo-hover');
                    });

                    siteBrand.addEventListener('focus', () => {
                        document.body.classList.add('logo-hover');
                    });

                    siteBrand.addEventListener('blur', () => {
                        document.body.classList.remove('logo-hover');
                    });

                    siteBrand.addEventListener('click', () => {
                        menuItems.forEach(el => el.classList.remove('active'));
                        setSearchOpen(false, { clear: true });
                        applyLayout('main');
                    });
                }

                let mouseX = HIDDEN_POINTER;
                let mouseY = HIDDEN_POINTER;
                window.addEventListener('mousemove', e => {
                    mouseX = e.clientX;
                    mouseY = e.clientY;
                });
                window.addEventListener('mouseout', () => {
                    mouseX = HIDDEN_POINTER;
                    mouseY = HIDDEN_POINTER;
                });

                function isAlbumSpinEmptyTarget(target) {
                    if (activeCategory !== 'album') return false;
                    if (isAboutPopupOpen || isPhotoBoothOpen || isDetailOpen) return false;
                    if (!target?.closest) return true;
                    return !target.closest(
                        '.icon-wrapper, .category-item, .site-brand, #search-panel, #detail-container, #icon-overlay, #camera-widget, #photo-booth-button, .butterfly-wrapper'
                    );
                }

                function albumPivotAngleFromPointer(e) {
                    const pivotX = (ALBUM_ROTATION_TARGET_LEFT / 100) * window.innerWidth;
                    const pivotY = (ALBUM_ROTATION_TARGET_TOP / 100) * window.innerHeight;
                    return Math.atan2(e.clientY - pivotY, e.clientX - pivotX) * (180 / Math.PI);
                }

                let albumDragSpin = null;

                window.addEventListener('pointerdown', (e) => {
                    if (e.button !== undefined && e.button !== 0) return;
                    if (!isAlbumSpinEmptyTarget(e.target)) return;
                    e.preventDefault();
                    albumDragSpin = {
                        pointerId: e.pointerId,
                        previousAngle: albumPivotAngleFromPointer(e)
                    };
                    window.getSelection?.().removeAllRanges();
                });

                window.addEventListener('pointermove', (e) => {
                    if (!albumDragSpin || e.pointerId !== albumDragSpin.pointerId) return;
                    e.preventDefault();
                    const nextAngle = albumPivotAngleFromPointer(e);
                    rotateAlbumSet(shortestAngleDiff(albumDragSpin.previousAngle, nextAngle));
                    albumDragSpin.previousAngle = nextAngle;
                });

                function stopAlbumDragSpin(e) {
                    if (!albumDragSpin) return;
                    if (e?.pointerId !== undefined && e.pointerId !== albumDragSpin.pointerId) return;
                    albumDragSpin = null;
                }

                window.addEventListener('pointerup', stopAlbumDragSpin);
                window.addEventListener('pointercancel', stopAlbumDragSpin);
                window.addEventListener('blur', stopAlbumDragSpin);

                const preferenceFloat = byId('preference-float');
                let activePreferenceSticker = null;

                function heartsForPreference(score) {
                    const count = Math.max(1, Math.min(10, Math.round(score || 1)));
                    return '♥'.repeat(count);
                }

                function positionPreferenceForIcon(data) {
                    if (!preferenceFloat) return false;

                    const iconRect = data.element.getBoundingClientRect();
                    const preferenceWidth = preferenceFloat.offsetWidth;
                    const preferenceHeight = preferenceFloat.offsetHeight;
                    const x = Math.min(
                        window.innerWidth - preferenceWidth - PREFERENCE_VIEWPORT_MARGIN,
                        Math.max(PREFERENCE_VIEWPORT_MARGIN, iconRect.left + iconRect.width / 2 - preferenceWidth / 2)
                    );
                    const visibleIconTop = iconRect.top + (data.visibleTopRatio * iconRect.height);
                    const referenceGap = PREFERENCE_TOP_GAP + (PREFERENCE_REFERENCE_VISIBLE_TOP_RATIO * iconRect.height);
                    const y = visibleIconTop - preferenceHeight - referenceGap;

                    if (y < PREFERENCE_VIEWPORT_MARGIN) return false;

                    preferenceFloat.style.left = `${x.toFixed(1)}px`;
                    preferenceFloat.style.top = `${y.toFixed(1)}px`;
                    return true;
                }

                function showPreferenceForIcon(data) {
                    if (!preferenceFloat || !data) return;

                    if (activePreferenceSticker !== data.sticker) {
                        activePreferenceSticker = data.sticker;
                        preferenceFloat.textContent = heartsForPreference(data.preferenceScore);
                        preferenceFloat.classList.remove('show');
                    }

                    if (!positionPreferenceForIcon(data)) {
                        hidePreference();
                        return;
                    }

                    preferenceFloat.offsetHeight;
                    requestAnimationFrame(() => {
                        preferenceFloat.classList.add('show');
                    });
                }

                function hidePreference() {
                    if (!preferenceFloat) return;
                    activePreferenceSticker = null;
                    preferenceFloat.classList.remove('show');
                }

                function updatePreferenceFloat() {
                    if (!preferenceFloat || albumDragSpin || isAboutPopupOpen || isPhotoBoothOpen || isDetailOpen || mouseX === HIDDEN_POINTER) {
                        hidePreference();
                        return;
                    }

                    const activeIcon = iconElementsData.reduce((best, data) => {
                        if (data.element.style.pointerEvents === 'none') return best;
                        if (data.currentScale < PREFERENCE_SCALE_THRESHOLD) return best;
                        if (!best || data.currentScale > best.currentScale) return data;
                        return best;
                    }, null);

                    if (activeIcon) {
                        showPreferenceForIcon(activeIcon);
                    } else {
                        hidePreference();
                    }
                }

                function settleMotion(current, target, rate, epsilon) {
                    const next = current + (target - current) * rate;
                    return Math.abs(next - target) < epsilon ? target : next;
                }

                function shortestAngleDiff(current, target) {
                    return ((target - current + 540) % 360) - 180;
                }

                function settleAngleMotion(current, target, rate, epsilon) {
                    const diff = shortestAngleDiff(current, target);
                    return Math.abs(diff) < epsilon ? target : current + diff * rate;
                }

                function animateIcons() {
                    iconElementsData.forEach(data => {
                        data.cx = (data.currentLeft / 100) * window.innerWidth;
                        data.cy = (data.currentTop / 100) * window.innerHeight;

                        if (isAboutPopupOpen) {
                            data.targetScale = 1;
                            data.targetLeft = ICON_CENTER_LEFT;
                            data.targetTop = ICON_CENTER_TOP;
                            data.targetRotation = 0;
                        } else if (isPhotoBoothOpen || isDetailOpen) {
                            data.targetScale = 1;
                            data.targetLeft = data.originLeft;
                            data.targetTop = data.originTop;
                            data.targetRotation = data.originRotation;
                        } else {
                            data.targetLeft = data.originLeft;
                            data.targetTop = data.originTop;
                            data.targetRotation = data.originRotation;
                            if (albumDragSpin) {
                                data.targetScale = 1;
                            } else {
                                const dx = mouseX - data.cx;
                                const dy = mouseY - data.cy;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance < ICON_HOVER_RADIUS) {
                                    const ratio = 1 - (distance / ICON_HOVER_RADIUS);
                                    data.targetScale = 1 + (Math.sin(ratio * Math.PI / 2) * ICON_MAX_SCALE_BOOST);
                                } else {
                                    data.targetScale = 1;
                                }
                            }
                        }
                        
                        const scaleDiff = Math.abs(data.currentScale - data.targetScale);
                        const leftDiff = Math.abs(data.currentLeft - data.targetLeft);
                        const topDiff = Math.abs(data.currentTop - data.targetTop);
                        const rotationDiff = Math.abs(shortestAngleDiff(data.currentRotation, data.targetRotation));

                        if (scaleDiff > 0.001 || leftDiff > 0.01 || topDiff > 0.01 || rotationDiff > 0.01) {
                            data.currentScale = settleMotion(data.currentScale, data.targetScale, ICON_SCALE_SETTLE_RATE, 0.001);
                            data.currentLeft = settleMotion(data.currentLeft, data.targetLeft, ICON_POSITION_SETTLE_RATE, 0.01);
                            data.currentTop = settleMotion(data.currentTop, data.targetTop, ICON_POSITION_SETTLE_RATE, 0.01);
                            data.currentRotation = settleAngleMotion(data.currentRotation, data.targetRotation, ICON_SCALE_SETTLE_RATE, 0.01);

                            data.element.style.left = `${data.currentLeft.toFixed(3)}%`;
                            data.element.style.top = `${data.currentTop.toFixed(3)}%`;
                            data.element.style.transform = `translate3d(-50%, -50%, 0) rotate(${data.currentRotation.toFixed(3)}deg) scale(${data.currentScale.toFixed(4)})`;

                            const newZIndex = data.currentScale > 1.05 ? 30 : 20;
                            if (data.element.style.zIndex != newZIndex) {
                                data.element.style.zIndex = newZIndex;
                            }
                        }
                    });
                    updatePreferenceFloat();
                    requestAnimationFrame(animateIcons);
                }
                animateIcons();
            }

            let cameraStreamActive = false;
            let fabricCanvas = null;
            const video = byId('video');
            const cameraWidget = byId('camera-widget');
            const videoContainer = byId('video-container');
            const tempCanvas = byId('temp-canvas');

            function createSingleButterfly() {
                const wrapper = document.createElement('div');
                wrapper.classList.add('butterfly-wrapper');
                const bobber = document.createElement('div');
                bobber.classList.add('butterfly-bob');
                const image = document.createElement('div');
                image.classList.add('butterfly-image');
                bobber.appendChild(image);
                wrapper.appendChild(bobber);
                document.body.appendChild(wrapper);

                wrapper.addEventListener('click', async (e) => {
                    e.stopPropagation();

                    if (isDetailOpen) return;

                    if (!navigator.mediaDevices?.getUserMedia) {
                        alert('이 브라우저에서는 카메라 기능을 사용할 수 없습니다.');
                        return;
                    }

                    if (!cameraStreamActive) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: {
                                    width: { ideal: 1280 },
                                    height: { ideal: 720 }
                                },
                                audio: false
                            });
                            video.srcObject = stream;
                            cameraStreamActive = true;
                        } catch (err) {
                            alert('카메라 접근 권한이 필요합니다.');
                            return;
                        }
                    }
                    cameraWidget.style.display = 'block';
                    setTimeout(() => cameraWidget.className = 'mini', 10);
                });

                let bX = window.innerWidth / 2;
                let bY = window.innerHeight / 2;
                let bRot = 45;
                let velocityX = 0.35;
                let velocityY = -0.2;
                let targetX = bX;
                let targetY = bY;
                let lastFlutterTurn = 0;

                function chooseButterflyTarget() {
                    const margin = 70;
                    targetX = Math.random() * (window.innerWidth - margin * 2) + margin;
                    targetY = Math.random() * (window.innerHeight - margin * 2) + margin;
                }

                function angleDifference(target, current) {
                    let diff = target - (current % 360);
                    if (diff > 180) diff -= 360;
                    if (diff < -180) diff += 360;
                    return diff;
                }

                function animateButterfly(time = 0) {
                    if (time - lastFlutterTurn > 2600 || Math.hypot(targetX - bX, targetY - bY) < 110) {
                        chooseButterflyTarget();
                        lastFlutterTurn = time;
                    }

                    const dx = targetX - bX;
                    const dy = targetY - bY;
                    const distance = Math.max(1, Math.hypot(dx, dy));
                    const drift = 0.014;
                    const lift = Math.sin(time / 520) * 0.035;

                    velocityX += (dx / distance) * drift + Math.cos(time / 900) * 0.01;
                    velocityY += (dy / distance) * drift + lift;

                    const speed = Math.hypot(velocityX, velocityY);
                    const maxSpeed = 1.55;
                    if (speed > maxSpeed) {
                        velocityX = (velocityX / speed) * maxSpeed;
                        velocityY = (velocityY / speed) * maxSpeed;
                    }

                    bX += velocityX;
                    bY += velocityY;

                    const margin = 42;
                    if (bX < margin || bX > window.innerWidth - margin) {
                        velocityX *= -0.75;
                        bX = Math.max(margin, Math.min(window.innerWidth - margin, bX));
                        chooseButterflyTarget();
                    }
                    if (bY < margin || bY > window.innerHeight - margin) {
                        velocityY *= -0.75;
                        bY = Math.max(margin, Math.min(window.innerHeight - margin, bY));
                        chooseButterflyTarget();
                    }

                    const targetRotation = Math.atan2(velocityY, velocityX) * (180 / Math.PI) + 90;
                    bRot += angleDifference(targetRotation, bRot) * 0.08;
                    const sway = Math.sin(time / 230) * 5;

                    wrapper.style.transform = `translate3d(${bX.toFixed(2)}px, ${bY.toFixed(2)}px, 0) rotate(${(bRot + sway).toFixed(2)}deg)`;
                    requestAnimationFrame(animateButterfly);
                }

                chooseButterflyTarget();
                requestAnimationFrame(animateButterfly);
            }
            createSingleButterfly();

            videoContainer.addEventListener('click', (e) => {
                if (cameraWidget.classList.contains('mini')) {
                    e.stopPropagation();

                    if (typeof fabric === 'undefined') {
                        alert('스티커 편집 기능을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
                        return;
                    }

                    cameraWidget.className = 'fullscreen';
                    isPhotoBoothOpen = true;

                    setTimeout(() => {
                        const ratio = video.videoHeight && video.videoWidth ? video.videoHeight / video.videoWidth : 9 / 16;
                        const displayWidth = Math.min(CAMERA_MAX_WIDTH, window.innerWidth - CAMERA_SIDE_GAP);
                        const displayHeight = displayWidth * ratio;

                        videoContainer.style.height = displayHeight + 'px';

                        if (!fabricCanvas) {
                            fabricCanvas = new fabric.Canvas('overlay-canvas');
                        }
                        fabricCanvas.setWidth(displayWidth);
                        fabricCanvas.setHeight(displayHeight);
                    }, CAMERA_LAYOUT_DELAY_MS);
                }
            });

            byId('btn-close-camera').addEventListener('click', (e) => {
                e.stopPropagation();
                cameraWidget.style.display = 'none';
                cameraWidget.className = '';
                isPhotoBoothOpen = false;

                videoContainer.style.height = '100%';

                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }
                cameraStreamActive = false;
                if (fabricCanvas) fabricCanvas.clear();
            });

            window.addSticker = function(imgId) {
                if (!fabricCanvas) return;
                const imgElement = byId(imgId);
                if (!imgElement) return;

                const imgInstance = new fabric.Image(imgElement, {
                    left: fabricCanvas.width / 2,
                    top: fabricCanvas.height / 2,
                    originX: 'center',
                    originY: 'center',
                    scaleX: 0.25,
                    scaleY: 0.25,
                    transparentCorners: false,
                    cornerColor: '#111',
                    cornerStrokeColor: '#fff',
                    borderColor: '#111',
                    cornerSize: 12,
                    padding: 10,
                    cornerStyle: 'circle'
                });
                fabricCanvas.add(imgInstance);
                fabricCanvas.setActiveObject(imgInstance);
            };

            function removeActiveSticker({ showEmptyMessage = false } = {}) {
                if (!fabricCanvas) return;
                const activeObject = fabricCanvas.getActiveObject();
                if (activeObject) {
                    fabricCanvas.remove(activeObject);
                } else if (showEmptyMessage) {
                    alert('삭제할 스티커를 먼저 클릭해서 선택해주세요.');
                }
            }

            function showCaptureFlash() {
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.inset = '0';
                flash.style.backgroundColor = 'white';
                flash.style.zIndex = '9999';
                flash.style.pointerEvents = 'none';
                document.body.appendChild(flash);

                setTimeout(() => {
                    flash.style.transition = 'opacity 0.4s ease-out';
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 400);
                }, 50);
            }

            function downloadImage(dataUrl, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                link.remove();
            }

            byId('delete-btn').addEventListener('click', function() {
                removeActiveSticker({ showEmptyMessage: true });
            });

            window.addEventListener('keydown', function(e) {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    removeActiveSticker();
                }
            });

            byId('capture-btn').addEventListener('click', function() {
                if (!fabricCanvas) return;
                fabricCanvas.discardActiveObject();
                fabricCanvas.renderAll();
                showCaptureFlash();

                try {
                    const ctx = tempCanvas.getContext('2d');
                    tempCanvas.width = fabricCanvas.width;
                    tempCanvas.height = fabricCanvas.height;
                    ctx.save();
                    ctx.translate(tempCanvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                    ctx.restore();

                    const fabricEl = fabricCanvas.lowerCanvasEl || fabricCanvas.getElement();
                    ctx.drawImage(fabricEl, 0, 0, tempCanvas.width, tempCanvas.height);
                    downloadImage(tempCanvas.toDataURL('image/png'), 'YerinB_Photo.png');
                } catch (e) {
                    console.error('저장 에러:', e);
                    alert('사진을 저장할 수 없습니다. 브라우저 보안 정책 때문에 차단될 수 있으니 localhost 또는 GitHub Pages에서 열어주세요.');
                }
            });
        });
    </script>
</body>
</html>
