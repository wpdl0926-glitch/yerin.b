<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YERIN.B</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <style>
        html {
            min-height: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial Black', 'Helvetica', sans-serif;
            background-color: #ffffff;
            background-image: url('background_1.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url('background_2.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            z-index: 0;
        }

        body.logo-hover::before {
            opacity: 1;
        }

        body:has(.site-brand:hover)::before {
            opacity: 1;
        }

        /* -------------------------------------------
           카테고리 메뉴 CSS
           ------------------------------------------- */
        .category-menu {
            position: fixed;
            top: calc(10% - 20px);
            left: calc(5% - 20px); 
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .category-item {
            font-family: 'Helvetica', sans-serif;
            font-weight: 400; /* Regular */
            font-size: 10pt; 
            letter-spacing: -0.02em; /* -2% */
            color: #000000; /* 기본 검은색 */
            cursor: pointer;
            transition: color 0.3s ease;
            text-transform: uppercase;
        }

        .category-item:hover {
            color: #000000;
        }

        /* 클릭 시(활성화 시) 적용될 색상 */
        .category-item.active {
            color: #FF969D;
        }

        .search-panel {
            display: flex;
            align-items: center;
            width: 150px;
            max-height: 0;
            opacity: 0;
            pointer-events: none;
            transform: translateY(-6px);
            transition: max-height 0.3s ease, opacity 0.3s ease, transform 0.3s ease;
            overflow: hidden;
        }

        .search-panel.open {
            max-height: 34px;
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .search-input {
            width: 100%;
            border: none;
            border-bottom: 1px solid #000000;
            background: transparent;
            padding: 4px 0;
            font-family: 'Helvetica', sans-serif;
            font-size: 10pt;
            color: #000000;
            outline: none;
            text-transform: lowercase;
        }

        .search-input::placeholder {
            color: rgba(0, 0, 0, 0.35);
        }
        /* ------------------------------------------- */

        /* 투명한 클릭 영역 역할 (yerin.b) */
        .site-brand {
            position: fixed;
            top: 6%;
            right: 4%;
            width: 16%;
            height: 7%;
            z-index: 1000;
        }

        /* 로딩 화면 */
        #loading-screen {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            z-index: 9999;
            opacity: 1;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            width: 70vw;
            height: 70vw;
            max-width: 800px;
            max-height: 800px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.8;
            will-change: transform;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            animation-timing-function: linear;
        }

        .blob-1 { background-color: rgba(150, 175, 215, 0.7); top: -20%; left: -20%; animation-name: moveBlob1; }
        .blob-2 { background-color: rgba(250, 225, 235, 0.8); bottom: -20%; right: -20%; animation-name: moveBlob2; }
        .blob-3 { background-color: rgba(180, 240, 210, 0.7); top: 10%; right: 10%; animation-name: moveBlob3; }
        .blob-4 { background-color: rgba(255, 250, 200, 0.7); bottom: 10%; left: 10%; animation-name: moveBlob4; }

        @keyframes moveBlob1 {
            0% { transform: translate(-30vw, -30vh) scale(1); }
            25% { transform: translate(15vw, 15vh) scale(1.3); }
            50% { transform: translate(30vw, -15vh) scale(1.1); }
            75% { transform: translate(-15vw, 30vh) scale(1.4); }
            100% { transform: translate(-30vw, -30vh) scale(1); }
        }
        @keyframes moveBlob2 {
            0% { transform: translate(30vw, 30vh) scale(1); }
            25% { transform: translate(-15vw, -15vh) scale(1.3); }
            50% { transform: translate(-30vw, 15vh) scale(1.1); }
            75% { transform: translate(15vw, -30vh) scale(1.4); }
            100% { transform: translate(30vw, 30vh) scale(1); }
        }
        @keyframes moveBlob3 {
            0% { transform: translate(15vw, -15vh) scale(1); }
            25% { transform: translate(-30vw, 15vh) scale(1.3); }
            50% { transform: translate(30vw, 30vh) scale(1.1); }
            75% { transform: translate(-15vw, -30vh) scale(1.4); }
            100% { transform: translate(15vw, -15vh) scale(1); }
        }
        @keyframes moveBlob4 {
            0% { transform: translate(-15vw, 15vh) scale(1); }
            25% { transform: translate(30vw, -15vh) scale(1.3); }
            50% { transform: translate(-30vw, -30vh) scale(1.1); }
            75% { transform: translate(15vw, 30vh) scale(1.4); }
            100% { transform: translate(-15vw, 15vh) scale(1); }
        }

        main {
            flex: 0 0 auto;
            display: block;
            width: 100%;
            min-height: 220vh;
            padding: 0;
            box-sizing: border-box;
            position: relative;
            overflow: visible;
        }

        .icon-scatter-container {
            position: sticky;
            top: 0;
            width: 100vw;
            max-width: none;
            height: 100vh;
            min-height: 100vh;
            overflow: visible;
        }

        body.feature-zoom-active .icon-scatter-container {
            position: fixed;
            inset: 0;
            z-index: 10;
        }

        body.feature-zoom-active .icon-wrapper.feature-zoom-hidden {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        body.genre-zoom-active .icon-scatter-container {
            position: fixed;
            inset: 0;
            z-index: 10;
        }

        body.genre-zoom-active .icon-wrapper.genre-zoom-hidden {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        body.album-zoom-active .icon-scatter-container {
            position: fixed;
            inset: 0;
            z-index: 10;
        }

        body.album-zoom-active .icon-wrapper.album-zoom-hidden {
            opacity: 1 !important;
            pointer-events: auto !important;
        }

        .icon-wrapper {
            position: absolute;
            z-index: 20;
            cursor: pointer;
            will-change: transform, left, top;
            transition: left 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        top 0.8s cubic-bezier(0.2, 0.8, 0.2, 1), 
                        width 0.6s cubic-bezier(0.4, 0, 0.2, 1), 
                        height 0.6s cubic-bezier(0.4, 0, 0.2, 1),
                        opacity 0.25s ease,
                        filter 0.25s ease;
        }

        body.album-dragging .icon-wrapper {
            transition: opacity 0.25s ease, filter 0.25s ease;
        }

        .icon-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        .year-label {
            display: none;
            position: absolute;
            left: 50%;
            bottom: calc(100% + 3px);
            transform: translateX(calc(-50% + var(--year-label-offset-x, 0px)));
            font-family: 'Pretendard', 'Helvetica', sans-serif;
            font-weight: 500;
            font-size: 7pt;
            line-height: 1;
            letter-spacing: 0;
            color: #000000;
            white-space: nowrap;
            pointer-events: none;
            user-select: none;
        }

        .icon-wrapper.show-year-label .year-label {
            display: block;
        }

        .album-center-indicator {
            position: fixed;
            left: 50%;
            top: 58%;
            z-index: 35;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translate(-50%, -100%);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        .album-center-indicator.show {
            opacity: 1;
        }

        .album-axis-dot {
            position: fixed;
            left: 50%;
            top: 50%;
            z-index: 36;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff39e6;
            transform: translate(-50%, -50%);
            opacity: 0;
            pointer-events: none;
            user-select: none;
            transition: opacity 0.2s ease;
        }

        .album-axis-dot.show {
            opacity: 1;
        }

        .album-center-name {
            min-width: 192px;
            margin-bottom: 11.2px;
            font-family: 'Pretendard', 'Helvetica', sans-serif;
            font-weight: 500;
            font-size: 11.2pt;
            line-height: 1;
            letter-spacing: 0;
            color: #000000;
            text-align: center;
            white-space: nowrap;
        }

        .album-center-triangle {
            width: 0;
            height: 0;
            border-left: 6.4px solid transparent;
            border-right: 6.4px solid transparent;
            border-top: 11.2px solid #000000;
        }

        #preference-float {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 950;
            font-family: 'Pretendard', 'Helvetica', sans-serif;
            font-weight: 500;
            font-size: 6pt;
            line-height: 160%;
            letter-spacing: 0;
            color: #000000;
            white-space: nowrap;
            text-align: center;
            opacity: 0;
            filter: blur(3px);
            transform: translate3d(0, 12px, 0) scale(0.98);
            transition: opacity 0.5s ease, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1), filter 0.5s ease;
            pointer-events: none;
            user-select: none;
            will-change: opacity, transform, filter;
        }

        #preference-float.show {
            opacity: 1;
            filter: blur(0);
            transform: translate3d(0, 0, 0) scale(1);
        }

        .icon-front,
        .icon-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .icon-back {
            transform: rotateY(180deg);
        }

        #icon-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1500;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #detail-container {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1600;
            width: 80vw;
            height: 80vh;
            perspective: 1200px;
            opacity: 0;
            transition: opacity 0.3s;
            cursor: pointer;
        }

        #detail-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }

        #detail-container.is-flipped #detail-inner {
            transform: rotateY(180deg);
        }

        .detail-face {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .detail-back {
            transform: rotateY(180deg);
        }

        .detail-face img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
            transform: scale(var(--detail-scale, 1));
            transform-origin: center;
            transition: transform 0.3s ease;
        }

        .butterfly-wrapper {
            position: fixed;
            left: 0;
            top: 0;
            z-index: 1000;
            cursor: pointer;
            pointer-events: auto;
            will-change: transform;
        }

        .butterfly-wrapper:hover .butterfly-image {
            filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.9));
        }

        .butterfly-bob {
            animation: bobUpAndDown 2.8s ease-in-out infinite alternate;
            will-change: transform;
        }

        .butterfly-image {
            width: 60px;
            height: 60px;
            background-image: url('butterfly.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            animation: flapWings 0.28s cubic-bezier(0.45, 0, 0.55, 1) infinite alternate;
            transform-origin: 50% 48%;
            transition: filter 0.3s;
            will-change: transform, filter;
        }

        @keyframes bobUpAndDown {
            0% { transform: translate3d(0, -10px, 0) rotate(-2deg); }
            50% { transform: translate3d(3px, 2px, 0) rotate(1deg); }
            100% { transform: translate3d(-2px, 12px, 0) rotate(2deg); }
        }

        @keyframes flapWings {
            0% { transform: perspective(120px) rotateY(-12deg) rotateZ(-3deg) scaleX(0.92) scaleY(1.04); }
            45% { transform: perspective(120px) rotateY(8deg) rotateZ(2deg) scaleX(1.02) scaleY(0.98); }
            100% { transform: perspective(120px) rotateY(18deg) rotateZ(4deg) scaleX(0.86) scaleY(1.05); }
        }

        #camera-widget {
            display: none;
            position: fixed;
            z-index: 2000;
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        #camera-widget.mini {
            display: block;
            bottom: 30px;
            left: 30px;
            width: 280px;
            height: 180px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            background: #000;
            cursor: pointer;
        }

        #camera-widget.mini:hover {
            transform: scale(1.05);
            border-color: rgba(255, 255, 255, 0.8);
        }

        #camera-widget.mini .fullscreen-only {
            display: none !important;
        }

        .mac-green-dot {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            background-color: #4cd137;
            border-radius: 50%;
            box-shadow: 0 0 8px #4cd137;
            z-index: 10;
        }

        #camera-widget.fullscreen .mac-green-dot {
            display: none;
        }

        #camera-widget.fullscreen {
            display: block;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 0;
            border: none;
        }

        #camera-main-area {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 15px;
        }

        #camera-widget.fullscreen #camera-main-area {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: auto;
            height: auto;
            align-items: center;
            z-index: 2100;
        }

        #video-container {
            position: relative;
            width: 100%;
            height: 100%;
            background-color: #000;
        }

        #camera-widget.fullscreen #video-container {
            width: min(800px, calc(100vw - 28px));
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
        }

        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        .canvas-container {
            position: absolute !important;
            top: 0;
            left: 0;
            z-index: 2 !important;
        }

        .sticker-palette {
            display: flex;
            flex-direction: row;
            gap: 15px;
            padding: 10px 15px;
            width: min(800px, calc(100vw - 28px));
            height: 100px;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            box-sizing: border-box;
        }

        .sticker-palette::-webkit-scrollbar {
            height: 8px;
        }

        .sticker-palette::-webkit-scrollbar-thumb {
            background-color: #cbd1d8;
            border-radius: 10px;
        }

        .sticker-palette img {
            width: 52px;
            height: 52px;
            object-fit: contain;
            cursor: pointer;
            transition: transform 0.2s;
            flex-shrink: 0;
        }

        .sticker-palette img:hover {
            transform: scale(1.15) rotate(5deg);
        }

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            width: min(800px, calc(100vw - 28px));
            height: 80px;
            margin-top: 5px;
        }

        .btn-delete {
            background-color: transparent;
            border: none;
            cursor: pointer;
            position: absolute;
            left: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background-color: rgba(255, 71, 87, 0.1);
            transform: scale(1.1);
        }

        .btn-delete svg {
            width: 28px;
            height: 28px;
            fill: #747d8c;
            transition: fill 0.2s;
        }

        .btn-delete:hover svg {
            fill: #ff4757;
        }

        .btn-capture {
            background-color: #ff4757;
            width: 76px;
            height: 76px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 5px solid #ffeaa7;
            box-shadow: 0 4px 12px rgba(255, 71, 87, 0.4);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-capture:hover {
            background-color: #ff6b81;
            transform: scale(1.08);
        }

        .btn-capture:active {
            transform: scale(0.95);
        }

        .btn-capture svg {
            width: 34px;
            height: 34px;
            fill: white;
        }

        #btn-close-camera {
            position: absolute;
            top: 30px;
            right: 40px;
            background: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.2s;
            z-index: 3010;
        }

        #btn-close-camera:hover {
            background: #ff4757;
            transform: rotate(90deg);
        }

        #temp-canvas {
            visibility: hidden;
            position: absolute;
            top: -9999px;
        }

        /* -------------------------------------------
           About 팝업 CSS
           ------------------------------------------- */
        #about-popup {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        #about-popup.show {
            opacity: 1;
            visibility: visible;
        }

        .popup-content {
            position: relative;
            transform: scale(0.9);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            perspective: 1000px;
            transform-origin: top center; 
        }

        #about-popup.show .popup-content {
            transform: scale(1);
        }

        .popup-content.folding {
            transform: rotateX(90deg) scale(0.8);
            opacity: 0;
            transition: transform 0.5s ease-in, opacity 0.5s ease-in;
        }

        .popup-body {
            position: relative;
            cursor: pointer;
            transition: transform 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .popup-body:hover {
            transform: scale(1.03);
        }

        .popup-body img {
            width: 380px;
            height: auto;
            display: block;
            filter: drop-shadow(0 15px 25px rgba(0,0,0,0.1));
        }

        .popup-close-area {
            position: absolute;
            top: 10%;
            left: 11%;
            width: 12%;
            height: 12%;
            cursor: pointer;
            z-index: 10;
        }

        html,
        body,
        body * {
            cursor: url('cursor-wing.png') 12 7, auto !important;
        }
    </style>
</head>
<body>
    <div id="loading-screen">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

    <div id="about-popup">
        <div class="popup-content">
            <div class="popup-close-area" id="popup-close-btn" title="닫기"></div>
            <div class="popup-body" id="popup-body-link" title="About 페이지로 이동">
                <img src="letter.png" alt="About Note">
            </div>
        </div>
    </div>

    <nav class="category-menu">
        <div class="category-item" data-category="album">ALBUM</div>
        <div class="category-item" data-category="year">YEAR</div>
        <div class="category-item" data-category="genre">GENRE</div>
        <div class="category-item" data-category="feature">FEATURE</div>
        <div class="category-item search-toggle" id="search-toggle" role="button" tabindex="0" aria-expanded="false" aria-controls="search-panel">SEARCH</div>
        <div class="search-panel" id="search-panel">
            <input class="search-input" id="search-input" type="search" placeholder="search" autocomplete="off" aria-label="Search stickers">
        </div>

            function getAlbumSourceOffset(layoutItem) {
                return {
                    x: ((parseFloat(layoutItem.left) - 50) / 100) * ALBUM_LAYOUT_SOURCE_WIDTH,
                    y: ((parseFloat(layoutItem.top) - 50) / 100) * ALBUM_LAYOUT_SOURCE_HEIGHT
                };
            }

            let albumSourcePivot = null;

            function solveThreeByThree(matrix) {
                const rows = matrix.map(row => row.slice());
                for (let col = 0; col < 3; col++) {
                    let pivotRow = col;
                    for (let row = col + 1; row < 3; row++) {
                        if (Math.abs(rows[row][col]) > Math.abs(rows[pivotRow][col])) {
                            pivotRow = row;
                        }
                    }

                    if (Math.abs(rows[pivotRow][col]) < 0.000001) return null;
                    [rows[col], rows[pivotRow]] = [rows[pivotRow], rows[col]];

                    const pivot = rows[col][col];
                    for (let c = col; c < 4; c++) {
                        rows[col][c] /= pivot;
                    }

                    for (let row = 0; row < 3; row++) {
                        if (row === col) continue;
                        const factor = rows[row][col];
                        for (let c = col; c < 4; c++) {
                            rows[row][c] -= factor * rows[col][c];
                        }
                    }
                }

                return rows.map(row => row[3]);
            }

            function getAlbumSourcePivot() {
                if (albumSourcePivot) return albumSourcePivot;

                const pivotLayoutItems = ALBUM_PIVOT_STICKERS
                    .map(numStr => imageExtractedAlbumLayout[parseInt(numStr, 10) - 1])
                    .filter(Boolean);

                const sums = pivotLayoutItems
                    .map(getAlbumSourceOffset)
                    .reduce((acc, point) => {
                        const { x, y } = point;
                        const rhs = -(x * x + y * y);
                        acc.xx += x * x;
                        acc.xy += x * y;
                        acc.x += x;
                        acc.yy += y * y;
                        acc.y += y;
                        acc.count += 1;
                        acc.xr += x * rhs;
                        acc.yr += y * rhs;
                        acc.r += rhs;
                        return acc;
                    }, {
                        xx: 0,
                        xy: 0,
                        x: 0,
                        yy: 0,
                        y: 0,
                        count: 0,
                        xr: 0,
                        yr: 0,
                        r: 0
                    });

                const solution = solveThreeByThree([
                    [sums.xx, sums.xy, sums.x, sums.xr],
                    [sums.xy, sums.yy, sums.y, sums.yr],
                    [sums.x, sums.y, sums.count, sums.r]
                ]);

                if (!solution) {
                    albumSourcePivot = {
                        left: ALBUM_SOURCE_PIVOT_LEFT,
                        top: ALBUM_SOURCE_PIVOT_TOP
                    };
                    return albumSourcePivot;
                }

                const [d, e] = solution;
                albumSourcePivot = {
                    left: 50 + ((-d / 2) / ALBUM_LAYOUT_SOURCE_WIDTH) * 100,
                    top: 50 + ((-e / 2) / ALBUM_LAYOUT_SOURCE_HEIGHT) * 100
                };

                return albumSourcePivot;
            }

            function rotationFacingAlbumCenterFromOffset(offset) {
                const angleToCenter = Math.atan2(-offset.y, -offset.x) * (180 / Math.PI);
                return angleToCenter + 90;
            }

            function rotationFacingViewportPoint(left, top, targetLeft, targetTop) {
                const dx = ((targetLeft - left) / 100) * window.innerWidth;
                const dy = ((targetTop - top) / 100) * window.innerHeight;
                return Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            }

            function normalizeRotation(degrees) {
                return ((degrees + 180) % 360 + 360) % 360 - 180;
            }

            function rotateViewportPointAround(left, top, targetLeft, targetTop, degrees) {
                const angle = degrees * (Math.PI / 180);
                const viewportWidth = Math.max(window.innerWidth || 1, 1);
                const viewportHeight = Math.max(window.innerHeight || 1, 1);
                const pivotX = (targetLeft / 100) * viewportWidth;
                const pivotY = (targetTop / 100) * viewportHeight;
                const dx = (left / 100) * viewportWidth - pivotX;
                const dy = (top / 100) * viewportHeight - pivotY;
                const cos = Math.cos(angle);
                const sin = Math.sin(angle);

                return {
                    left: ((pivotX + dx * cos - dy * sin) / viewportWidth) * 100,
                    top: ((pivotY + dx * sin + dy * cos) / viewportHeight) * 100
                };
            }

            function setAlbumRotatedOrigin(data, baseLeft, baseTop, baseRotation) {
                const rotated = rotateViewportPointAround(
                    baseLeft,
                    baseTop,
                    ALBUM_ROTATION_TARGET_LEFT,

                    albumSetRotation
                );
                data.originLeft = rotated.left;
                data.originTop = rotated.top;
                data.originRotation = normalizeRotation(baseRotation + albumSetRotation);

                const groupRotation = rotationFacingAlbumCenterFromOffset(axisOffset);

                group.stickers.forEach(numStr => {

                return rotationMap;

                function isAlbumSpinEmptyTarget(target) {

                function albumPivotAngleFromPointer(e) {

                const preferenceFloat = byId('preference-float');

                function heartsForPreference(score) {

                function positionPreferenceForIcon(data) {
                    if (!preferenceFloat) return false;

                    const iconRect = data.element.getBoundingClientRect();
                    const preferenceWidth = preferenceFloat.offsetWidth;
                    const preferenceHeight = preferenceFloat.offsetHeight;
                    const x = Math.min(
                        window.innerWidth - preferenceWidth - PREFERENCE_VIEWPORT_MARGIN,
                        Math.max(PREFERENCE_VIEWPORT_MARGIN, iconRect.left + iconRect.width / 2 - preferenceWidth / 2)
                    );
                    const visibleIconTop = iconRect.top + (data.visibleTopRatio * iconRect.height);
                    const referenceGap = PREFERENCE_TOP_GAP + (PREFERENCE_REFERENCE_VISIBLE_TOP_RATIO * iconRect.height);
                    const y = visibleIconTop - preferenceHeight - referenceGap;

                    if (y < PREFERENCE_VIEWPORT_MARGIN) return false;

                    preferenceFloat.style.left = `${x.toFixed(1)}px`;
                    preferenceFloat.style.top = `${y.toFixed(1)}px`;
                    return true;

                function showPreferenceForIcon(data) {

                function updatePreferenceFloat() {

                        hidePreference();
                        return;
                    }

                    const activeIcon = iconElementsData.reduce((best, data) => {
                        if (data.element.style.pointerEvents === 'none') return best;
                        if (data.currentScale < PREFERENCE_SCALE_THRESHOLD) return best;
                        if (!best || data.currentScale > best.currentScale) return data;
                        return best;
                    }, null);

                    if (activeIcon) {
                        showPreferenceForIcon(activeIcon);
                    } else {
                        hidePreference();
                    }

                function settleMotion(current, target, rate, epsilon) {
                    const next = current + (target - current) * rate;
                    return Math.abs(next - target) < epsilon ? target : next;
                }

                function shortestAngleDiff(current, target) {
                    return ((target - current + 540) % 360) - 180;
                }

                function settleAngleMotion(current, target, rate, epsilon) {
                    const diff = shortestAngleDiff(current, target);
                    return Math.abs(diff) < epsilon ? target : current + diff * rate;
                }

                function getScrollProgress() {
                    const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
                    return clamp(window.scrollY / maxScroll, 0, 1);
                }

                function getVisibleLayoutTopRange() {
                    const tops = iconElementsData
                        .map(data => data.originTop)
                        .filter(Number.isFinite);

                    if (!tops.length) {
                        return { min: 50, max: 50 };
                    }

                    return {
                        min: Math.min(...tops),
                        max: Math.max(...tops)
                    };
                }

                function getScrollFocusTop() {
                    const range = getVisibleLayoutTopRange();
                    return range.min + (range.max - range.min) * getScrollProgress();
                }

                function getVisibleLayoutLeftRange() {
                    const lefts = iconElementsData
                        .map(data => data.originLeft)
                        .filter(Number.isFinite);

                    if (!lefts.length) {
                        return { min: 50, max: 50 };
                    }

                    return {
                        min: Math.min(...lefts),
                        max: Math.max(...lefts)
                    };
                }

                function getScrollFocusLeft() {
                    const range = getVisibleLayoutLeftRange();
                    return range.min + (range.max - range.min) * getScrollProgress();
                }

                function getFeatureGroupFitScale(groupItems, focus) {
                    if (!groupItems.length || !focus) return 1;

                    const viewportWidth = Math.max(window.innerWidth || 1, 1);
                    const viewportHeight = Math.max(window.innerHeight || 1, 1);
                    const maxXOffset = Math.max(
                        0.1,
                        ...groupItems.map(data => {
                            const halfWidthPercent = ((data.element.offsetWidth || 1) / viewportWidth) * 50;
                            return Math.abs(data.originLeft - focus.left) + halfWidthPercent;
                        })
                    );
                    const maxYOffset = Math.max(
                        0.1,
                        ...groupItems.map(data => {
                            const halfHeightPercent = ((data.element.offsetHeight || 1) / viewportHeight) * 50;
                            return Math.abs(data.originTop - focus.top) + halfHeightPercent;
                        })
                    );
                    const fitX = Math.min(
                        (FEATURE_ZOOM_TARGET_LEFT - FEATURE_ZOOM_VIEWPORT_MARGIN_X) / maxXOffset,
                        (100 - FEATURE_ZOOM_VIEWPORT_MARGIN_X - FEATURE_ZOOM_TARGET_LEFT) / maxXOffset
                    );
                    const fitY = Math.min(
                        (FEATURE_ZOOM_TARGET_TOP - FEATURE_ZOOM_VIEWPORT_MARGIN_Y) / maxYOffset,
                        (100 - FEATURE_ZOOM_VIEWPORT_MARGIN_Y - FEATURE_ZOOM_TARGET_TOP) / maxYOffset
                    );

                    return clamp(Math.min(fitX, fitY, FEATURE_ZOOM_MAX_SCALE), 1, FEATURE_ZOOM_MAX_SCALE);
                }

                function getAlbumGroupFillScale(groupItems, focus) {
                    if (!groupItems.length || !focus) return 1;

                    const viewportWidth = Math.max(window.innerWidth || 1, 1);
                    const viewportHeight = Math.max(window.innerHeight || 1, 1);
                    const maxXOffset = Math.max(
                        0.1,
                        ...groupItems.map(data => {
                            const halfWidthPercent = ((data.element.offsetWidth || 1) / viewportWidth) * 50;
                            return Math.abs(data.originLeft - focus.left) + halfWidthPercent;
                        })
                    );
                    const maxYOffset = Math.max(
                        0.1,
                        ...groupItems.map(data => {
                            const halfHeightPercent = ((data.element.offsetHeight || 1) / viewportHeight) * 50;
                            return Math.abs(data.originTop - focus.top) + halfHeightPercent;
                        })
                    );
                    const fitX = Math.min(
                        (FEATURE_ZOOM_TARGET_LEFT - ALBUM_ZOOM_VIEWPORT_MARGIN_X) / maxXOffset,
                        (100 - ALBUM_ZOOM_VIEWPORT_MARGIN_X - FEATURE_ZOOM_TARGET_LEFT) / maxXOffset
                    );
                    const fitY = Math.min(
                        (FEATURE_ZOOM_TARGET_TOP - ALBUM_ZOOM_VIEWPORT_MARGIN_Y) / maxYOffset,
                        (100 - ALBUM_ZOOM_VIEWPORT_MARGIN_Y - FEATURE_ZOOM_TARGET_TOP) / maxYOffset
                    );

                    return clamp(Math.min(fitX, fitY, ALBUM_ZOOM_MAX_SCALE) * 0.96, 1, ALBUM_ZOOM_MAX_SCALE);
                }

                function getFeatureZoomFocusGroups() {
                    const columns = iconElementsData.reduce((map, data) => {
                        if (!Number.isFinite(data.originLeft) || !Number.isFinite(data.originTop)) return map;
                        const key = data.originLeft.toFixed(2);
                        if (!map.has(key)) {
                            map.set(key, {
                                left: Number(key),
                                items: []
                            });
                        }
                        map.get(key).items.push(data);
                        return map;
                    }, new Map());
                    const orderedColumns = [...columns.values()].sort((a, b) => a.left - b.left);

                    if (!orderedColumns.length) {
                        return [{ left: FEATURE_ZOOM_TARGET_LEFT, top: FEATURE_ZOOM_TARGET_TOP }];
                    }

                    const columnGroups = [];
                    let columnIndex = 0;
                    FEATURE_ZOOM_GROUP_ITEM_COUNTS.forEach((targetCount, groupIndex) => {
                        const groupColumns = [];
                        let itemCount = 0;

                        while (columnIndex < orderedColumns.length) {
                            const column = orderedColumns[columnIndex];
                            const isLastTargetGroup = groupIndex === FEATURE_ZOOM_GROUP_ITEM_COUNTS.length - 1;

                            groupColumns.push(column);
                            itemCount += column.items.length;
                            columnIndex += 1;

                            if (!isLastTargetGroup && itemCount >= targetCount) {
                                break;
                            }
                        }

                        if (groupColumns.length) {
                            columnGroups.push(groupColumns);
                        }
                    });

                    return columnGroups.map(groupColumns => {
                        const groupItems = groupColumns.flatMap(column => column.items);

                        if (!groupItems.length) {
                            const fallbackLeft = groupColumns.reduce((sum, column) => sum + column.left, 0) / groupColumns.length;
                            return { left: fallbackLeft, top: FEATURE_ZOOM_TARGET_TOP, scale: 1, items: [] };
                        }

                        const focus = {
                            left: groupItems.reduce((sum, data) => sum + data.originLeft, 0) / groupItems.length,
                            top: groupItems.reduce((sum, data) => sum + data.originTop, 0) / groupItems.length
                        };

                        return {
                            ...focus,
                            scale: getFeatureGroupFitScale(groupItems, focus),
                            items: groupItems
                        };
                    });

                    const sectionIndex = Math.min(
                        Math.floor(clamp(progress, 0, 0.9999) * groups.length),
                        groups.length - 1
                    );

                    return groups[sectionIndex];
                }

                function easeOutCubic(value) {

                    return 1 - Math.pow(1 - progress, 3);

                        focus,
                        scale: isActive ? (focus?.scale || 1) : 1,

                            ? new Set((focus?.items || []).map(data => data.sticker))
                            : new Set()
                    };
                }

                function getFeatureZoomStepProgress(step) {

                    const sectionCount = Math.max(groups.length, 1);

                    const targetTop = step < 0 ? 0 : maxScroll * getFeatureZoomStepProgress(step);
                    window.scrollTo({

                        left: 0,
                        behavior: 'smooth'
                    });

                function returnToFeatureOverview() {
                    isFeatureOverviewResetting = true;
                    featureZoomStep = -1;
                    setSearchOpen(false, { clear: true });
                    iconElementsData.forEach(data => {

                    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
                    applyLayout('feature');
                    requestAnimationFrame(() => {
                        isFeatureOverviewResetting = false;
                    });
                }

                function getGenreZoomFocusGroups() {
                    const rows = iconElementsData.reduce((map, data) => {
                        if (!Number.isFinite(data.originLeft) || !Number.isFinite(data.originTop)) return map;
                        const key = data.originTop.toFixed(2);
                        if (!map.has(key)) {
                            map.set(key, {
                                top: Number(key),
                                items: []
                            });
                        }
                        map.get(key).items.push(data);
                        return map;
                    }, new Map());
                    const orderedRows = [...rows.values()].sort((a, b) => a.top - b.top);

                    if (!orderedRows.length) {
                        return [{ left: FEATURE_ZOOM_TARGET_LEFT, top: FEATURE_ZOOM_TARGET_TOP, scale: 1, items: [] }];
                    }

                    return orderedRows.map(row => {
                        const groupItems = row.items.sort((a, b) => a.originLeft - b.originLeft);
                        const focus = {
                            left: groupItems.reduce((sum, data) => sum + data.originLeft, 0) / groupItems.length,
                            top: groupItems.reduce((sum, data) => sum + data.originTop, 0) / groupItems.length
                        };

                        return {
                            ...focus,
                            scale: getFeatureGroupFitScale(groupItems, focus),
                            items: groupItems
                        };

                function getGenreAreaFocusPoint(progress = getScrollProgress()) {

                    if (groups.length === 1) return groups[0];

                        Math.floor(clamp(progress, 0, 0.9999) * groups.length),
                        groups.length - 1
                    );

                }

                function getGenreZoomState(progress = getScrollProgress()) {
                    const focus = getGenreAreaFocusPoint(progress);
                    const isActive = !isGenreOverviewResetting && progress > 0.001;
                    return {
                        active: isActive,
                        focus,
                        scale: isActive ? (focus?.scale || 1) : 1,
                        visibleStickers: isActive
                            ? new Set((focus?.items || []).map(data => data.sticker))
                            : new Set()
                    };
                }

                function getGenreZoomStepProgress(step) {
                    const groups = getGenreZoomFocusGroups();
                    const sectionCount = Math.max(groups.length, 1);
                    return clamp((step + GENRE_ZOOM_STEP_PROGRESS_IN_SECTION) / sectionCount, 0, 1);
                }

                function scrollToGenreZoomStep(step) {
                    const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 0);
                    const targetTop = step < 0 ? 0 : maxScroll * getGenreZoomStepProgress(step);
                    window.scrollTo({
                        top: targetTop,
                        left: 0,
                        behavior: 'smooth'
                    });
                }

                function returnToGenreOverview() {
                    isGenreOverviewResetting = true;
                    genreZoomStep = -1;
                    setSearchOpen(false, { clear: true });
                    iconElementsData.forEach(data => {
                        data.element.classList.remove('genre-zoom-hidden');
                    });
                    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
                    applyLayout('genre');
                    requestAnimationFrame(() => {
                        isGenreOverviewResetting = false;
                    });
                }

                function getAlbumZoomFocusGroups() {
                    const groups = albumGroups
                        .map(group => ({
                            name: group.name,
                            items: group.stickers
                                .map(numStr => iconElementsData[parseInt(numStr, 10) - 1])
                                .filter(data => (
                                    data &&
                                    Number.isFinite(data.originLeft) &&
                                    Number.isFinite(data.originTop)
                                ))
                        }))
                        .filter(group => group.items.length);

                    if (!groups.length) {
                        return [{ left: FEATURE_ZOOM_TARGET_LEFT, top: FEATURE_ZOOM_TARGET_TOP, scale: 1, items: [] }];
                    }

                    return groups.map(group => {
                        const groupItems = group.items.sort((a, b) => a.originTop - b.originTop || a.originLeft - b.originLeft);
                        const focus = {
                            left: groupItems.reduce((sum, data) => sum + data.originLeft, 0) / groupItems.length,
                            top: groupItems.reduce((sum, data) => sum + data.originTop, 0) / groupItems.length
                        };
                        const groupRotation = getAverageAngle(groupItems.map(data => data.originRotation || 0));

                        return {
                            name: group.name,
                            ...focus,
                            rotation: normalizeRotation(-groupRotation),
                            scale: getAlbumGroupFillScale(groupItems, focus),
                            items: groupItems
                        };
                    });
                }

                function getAverageAngle(angles) {
                    if (!angles.length) return 0;

                    const vector = angles.reduce((sum, angle) => {
                        const radians = angle * (Math.PI / 180);
                        sum.x += Math.cos(radians);
                        sum.y += Math.sin(radians);
                        return sum;
                    }, { x: 0, y: 0 });

                    if (Math.abs(vector.x) < 0.000001 && Math.abs(vector.y) < 0.000001) return 0;
                    return Math.atan2(vector.y, vector.x) * (180 / Math.PI);
                }

                function getAlbumAreaFocusPoint(progress = getScrollProgress()) {
                    const groups = getAlbumZoomFocusGroups();
                    if (groups.length === 1) return groups[0];

                    const sectionIndex = Math.min(
                        Math.floor(clamp(progress, 0, 0.9999) * groups.length),
                        groups.length - 1
                    );

                    return groups[sectionIndex];
                }

                function getAlbumZoomState(progress = getScrollProgress()) {
                    const focus = getAlbumAreaFocusPoint(progress);
                    const isActive = !isAlbumOverviewResetting && progress > 0.001;
                    return {
                        active: isActive,
                        focus,
                        scale: isActive ? (focus?.scale || 1) : 1,
                        visibleStickers: isActive
                            ? new Set((focus?.items || []).map(data => data.sticker))
                            : new Set()
                    };
                }

                function getAlbumZoomStepProgress(step) {
                    const groups = getAlbumZoomFocusGroups();
                    const sectionCount = Math.max(groups.length, 1);
                    return clamp((step + ALBUM_ZOOM_STEP_PROGRESS_IN_SECTION) / sectionCount, 0, 1);
                }

                function scrollToAlbumZoomStep(step) {
                    const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 0);
                    const targetTop = step < 0 ? 0 : maxScroll * getAlbumZoomStepProgress(step);
                    window.scrollTo({
                        top: targetTop,
                        left: 0,
                        behavior: 'smooth'
                    });
                }

                function returnToAlbumOverview() {
                    isAlbumOverviewResetting = true;
                    albumZoomStep = -1;
                    setSearchOpen(false, { clear: true });
                    iconElementsData.forEach(data => {
                        data.element.classList.remove('album-zoom-hidden');
                    });
                    window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
                    applyLayout('album');
                    requestAnimationFrame(() => {
                        isAlbumOverviewResetting = false;
                    });
                }

                function getFeatureZoomedPosition(data, zoomState) {
                    if (!zoomState?.focus || !Number.isFinite(data.originLeft) || !Number.isFinite(data.originTop)) {
                        return {
                            left: data.originLeft,
                            top: data.originTop
                        };
                    }

                    const viewportWidth = Math.max(window.innerWidth || 1, 1);
                    const viewportHeight = Math.max(window.innerHeight || 1, 1);
                    const angle = (zoomState.rotation || 0) * (Math.PI / 180);
                    const cos = Math.cos(angle);
                    const sin = Math.sin(angle);
                    const offsetX = ((data.originLeft - zoomState.focus.left) / 100) * viewportWidth;
                    const offsetY = ((data.originTop - zoomState.focus.top) / 100) * viewportHeight;
                    const rotatedX = (offsetX * cos - offsetY * sin) * zoomState.scale;
                    const rotatedY = (offsetX * sin + offsetY * cos) * zoomState.scale;
                    const targetX = (FEATURE_ZOOM_TARGET_LEFT / 100) * viewportWidth;
                    const targetY = (FEATURE_ZOOM_TARGET_TOP / 100) * viewportHeight;

                    return {
                        left: ((targetX + rotatedX) / viewportWidth) * 100,
                        top: ((targetY + rotatedY) / viewportHeight) * 100
                    };
                }

                function getFeatureColumnLefts() {
                    return featureColumnLefts;
                }

                function getFocusedFeatureColumnLeft() {
                    const columnLefts = getFeatureColumnLefts();
                    if (!columnLefts.length) return null;

                    const targetLeft = getScrollFocusLeft();
                    return columnLefts.reduce((best, left) => (
                        Math.abs(left - targetLeft) < Math.abs(best - targetLeft) ? left : best
                    ), columnLefts[0]);
                }

                function hideScrollRowZoom() {
                    if (!scrollRowZoom) return;
                    activeZoomRowKey = null;
                    if (scrollRowZoom.classList.contains('show')) {
                        scrollRowZoom.classList.remove('show');
                    }
                }

                function updateScrollRowZoom() {
                    if (
                        !scrollRowZoom ||
                        activeCategory !== 'feature' ||
                        isAboutPopupOpen ||
                        isPhotoBoothOpen ||
                        isDetailOpen
                    ) {
                        hideScrollRowZoom();
                        return;
                    }

                    const focusedColumnLeft = getFocusedFeatureColumnLeft();
                    if (!Number.isFinite(focusedColumnLeft)) {
                        hideScrollRowZoom();
                        return;
                    }

                    const rowKey = focusedColumnLeft.toFixed(2);
                    if (activeZoomRowKey !== rowKey) {
                        const rowItems = iconElementsData
                            .filter(data => Math.abs(data.originLeft - focusedColumnLeft) < 0.03)
                            .sort((a, b) => a.originTop - b.originTop);

                        scrollRowZoom.innerHTML = '';
                        scrollRowZoom.style.setProperty('--row-count', String(Math.max(rowItems.length, 1)));

                        rowItems.forEach(data => {
                            const clone = document.createElement('div');
                            clone.className = 'scroll-row-zoom-item';
                            clone.style.backgroundImage = `url('${stickerUrl(data.sticker)}')`;
                            scrollRowZoom.appendChild(clone);
                        });

                        activeZoomRowKey = rowKey;
                    }

                    scrollRowZoom.classList.add('show');
                }

                function getScrollScaleForIcon(data, scrollState) {
                    if (window.scrollY <= 1 || !Number.isFinite(data.originTop)) return 1;
                    if (activeCategory === 'feature') return scrollState.featureZoom?.scale || 1;
                    if (activeCategory === 'genre') return scrollState.genreZoom?.scale || 1;
                    if (activeCategory === 'album') return scrollState.albumZoom?.scale || 1;

                    const distance = Math.abs(data.originTop - scrollState.topFocus);
                    const ratio = 1 - clamp(distance / SCROLL_FOCUS_BAND, 0, 1);
                    return 1 + Math.sin(ratio * Math.PI / 2) * SCROLL_ICON_SCALE_BOOST;
                }

                function animateIcons() {
                    const scrollProgress = getScrollProgress();
                    const scrollState = {
                        featureZoom: activeCategory === 'feature' ? getFeatureZoomState(scrollProgress) : null,
                        genreZoom: activeCategory === 'genre' ? getGenreZoomState(scrollProgress) : null,
                        albumZoom: activeCategory === 'album' ? getAlbumZoomState(scrollProgress) : null,
                        topFocus: ['feature', 'genre', 'album'].includes(activeCategory) ? null : getScrollFocusTop()
                    };

                    iconElementsData.forEach(data => {
                        data.cx = (data.currentLeft / 100) * window.innerWidth;
                        data.cy = (data.currentTop / 100) * window.innerHeight;

                        if (isAboutPopupOpen) {
                            data.targetScale = 1;
                            data.targetLeft = ICON_CENTER_LEFT;
                            data.targetTop = ICON_CENTER_TOP;
                            data.targetRotation = 0;
                        } else if (isPhotoBoothOpen || isDetailOpen) {
                            data.targetScale = 1;
                            data.targetLeft = data.originLeft;
                            data.targetTop = data.originTop;
                            data.targetRotation = data.originRotation;
                        } else {
                            data.element.classList.toggle(
                                'feature-zoom-hidden',
                                activeCategory === 'feature' &&
                                scrollState.featureZoom?.active &&
                                scrollState.featureZoom?.visibleStickers?.size &&
                                !scrollState.featureZoom.visibleStickers.has(data.sticker)
                            );
                            data.element.classList.toggle(
                                'genre-zoom-hidden',
                                activeCategory === 'genre' &&
                                scrollState.genreZoom?.active &&
                                scrollState.genreZoom?.visibleStickers?.size &&
                                !scrollState.genreZoom.visibleStickers.has(data.sticker)
                            );
                            data.element.classList.toggle(
                                'album-zoom-hidden',
                                activeCategory === 'album' &&
                                scrollState.albumZoom?.active &&
                                scrollState.albumZoom?.visibleStickers?.size &&
                                !scrollState.albumZoom.visibleStickers.has(data.sticker)
                            );
                            data.targetLeft = data.originLeft;
                            data.targetTop = data.originTop;
                            data.targetRotation = data.originRotation;
                            if (activeCategory === 'feature' && scrollState.featureZoom?.scale > 1.001) {
                                const zoomedPosition = getFeatureZoomedPosition(data, scrollState.featureZoom);
                                data.targetLeft = zoomedPosition.left;
                                data.targetTop = zoomedPosition.top;
                            }
                            if (activeCategory === 'genre' && scrollState.genreZoom?.scale > 1.001) {
                                const zoomedPosition = getFeatureZoomedPosition(data, scrollState.genreZoom);
                                data.targetLeft = zoomedPosition.left;
                                data.targetTop = zoomedPosition.top;
                            }
                            if (activeCategory === 'album' && scrollState.albumZoom?.scale > 1.001) {
                                const zoomedPosition = getFeatureZoomedPosition(data, scrollState.albumZoom);
                                data.targetLeft = zoomedPosition.left;
                                data.targetTop = zoomedPosition.top;
                                data.targetRotation = scrollState.albumZoom.visibleStickers?.has(data.sticker)
                                    ? 0
                                    : normalizeRotation(data.originRotation + (scrollState.albumZoom.rotation || 0));
                            }
                            if (albumDragSpin) {
                                data.targetScale = 1;
                            } else {
                                const scrollScale = getScrollScaleForIcon(data, scrollState);
                                let hoverScale = 1;
                                const dx = mouseX - data.cx;
                                const dy = mouseY - data.cy;
                                const distance = Math.sqrt(dx * dx + dy * dy);
                                if (distance < ICON_HOVER_RADIUS) {
                                    const ratio = 1 - (distance / ICON_HOVER_RADIUS);
                                    hoverScale = 1 + (Math.sin(ratio * Math.PI / 2) * ICON_MAX_SCALE_BOOST);
                                }
                                data.targetScale = Math.max(scrollScale, hoverScale);
                            }
                        }
                        
                        const scaleDiff = Math.abs(data.currentScale - data.targetScale);
                        const leftDiff = Math.abs(data.currentLeft - data.targetLeft);
                        const topDiff = Math.abs(data.currentTop - data.targetTop);
                        const rotationDiff = Math.abs(shortestAngleDiff(data.currentRotation, data.targetRotation));

                        if (scaleDiff > 0.001 || leftDiff > 0.01 || topDiff > 0.01 || rotationDiff > 0.01) {
                            data.currentScale = settleMotion(data.currentScale, data.targetScale, ICON_SCALE_SETTLE_RATE, 0.001);
                            data.currentLeft = settleMotion(data.currentLeft, data.targetLeft, ICON_POSITION_SETTLE_RATE, 0.01);
                            data.currentTop = settleMotion(data.currentTop, data.targetTop, ICON_POSITION_SETTLE_RATE, 0.01);
                            data.currentRotation = settleAngleMotion(data.currentRotation, data.targetRotation, ICON_SCALE_SETTLE_RATE, 0.01);

                            data.element.style.left = `${data.currentLeft.toFixed(3)}%`;
                            data.element.style.top = `${data.currentTop.toFixed(3)}%`;
                            data.element.style.transform = `translate3d(-50%, -50%, 0) rotate(${data.currentRotation.toFixed(3)}deg) scale(${data.currentScale.toFixed(4)})`;

                            const newZIndex = data.currentScale > 1.05 ? 30 : 20;
                            if (data.element.style.zIndex != newZIndex) {
                                data.element.style.zIndex = newZIndex;
                            }
                        }
                    });
                    hideScrollRowZoom();
                    if (activeCategory === 'album') {
                        updateAlbumCenterName();
                    }
                    updatePreferenceFloat();
                    requestAnimationFrame(animateIcons);
                }
                animateIcons();
            }

            let cameraStreamActive = false;
            let fabricCanvas = null;
            const video = byId('video');
            const cameraWidget = byId('camera-widget');
            const videoContainer = byId('video-container');
            const tempCanvas = byId('temp-canvas');

            function createSingleButterfly() {
                const wrapper = document.createElement('div');
                wrapper.classList.add('butterfly-wrapper');
                const bobber = document.createElement('div');
                bobber.classList.add('butterfly-bob');
                const image = document.createElement('div');
                image.classList.add('butterfly-image');
                bobber.appendChild(image);
                wrapper.appendChild(bobber);
                document.body.appendChild(wrapper);

                wrapper.addEventListener('click', async (e) => {
                    e.stopPropagation();

                    if (isDetailOpen) return;

                    if (!navigator.mediaDevices?.getUserMedia) {
                        alert('이 브라우저에서는 카메라 기능을 사용할 수 없습니다.');
                        return;
                    }

                    if (!cameraStreamActive) {
                        try {
                            const stream = await navigator.mediaDevices.getUserMedia({
                                video: {
                                    width: { ideal: 1280 },
                                    height: { ideal: 720 }
                                },
                                audio: false
                            });
                            video.srcObject = stream;
                            cameraStreamActive = true;
                        } catch (err) {
                            alert('카메라 접근 권한이 필요합니다.');
                            return;
                        }
                    }
                    cameraWidget.style.display = 'block';
                    setTimeout(() => cameraWidget.className = 'mini', 10);
                });

                let bX = window.innerWidth / 2;
                let bY = window.innerHeight / 2;
                let bRot = 45;
                let velocityX = 0.35;
                let velocityY = -0.2;
                let targetX = bX;
                let targetY = bY;
                let lastFlutterTurn = 0;

                function chooseButterflyTarget() {
                    const margin = 70;
                    targetX = Math.random() * (window.innerWidth - margin * 2) + margin;
                    targetY = Math.random() * (window.innerHeight - margin * 2) + margin;
                }

                function angleDifference(target, current) {
                    let diff = target - (current % 360);
                    if (diff > 180) diff -= 360;
                    if (diff < -180) diff += 360;
                    return diff;
                }

                function animateButterfly(time = 0) {
                    if (time - lastFlutterTurn > 2600 || Math.hypot(targetX - bX, targetY - bY) < 110) {
                        chooseButterflyTarget();
                        lastFlutterTurn = time;
                    }

                    const dx = targetX - bX;
                    const dy = targetY - bY;
                    const distance = Math.max(1, Math.hypot(dx, dy));
                    const drift = 0.014;
                    const lift = Math.sin(time / 520) * 0.035;

                    velocityX += (dx / distance) * drift + Math.cos(time / 900) * 0.01;
                    velocityY += (dy / distance) * drift + lift;

                    const speed = Math.hypot(velocityX, velocityY);
                    const maxSpeed = 1.55;
                    if (speed > maxSpeed) {
                        velocityX = (velocityX / speed) * maxSpeed;
                        velocityY = (velocityY / speed) * maxSpeed;
                    }

                    bX += velocityX;
                    bY += velocityY;

                    const margin = 42;
                    if (bX < margin || bX > window.innerWidth - margin) {
                        velocityX *= -0.75;
                        bX = Math.max(margin, Math.min(window.innerWidth - margin, bX));
                        chooseButterflyTarget();
                    }
                    if (bY < margin || bY > window.innerHeight - margin) {
                        velocityY *= -0.75;
                        bY = Math.max(margin, Math.min(window.innerHeight - margin, bY));
                        chooseButterflyTarget();
                    }

                    const targetRotation = Math.atan2(velocityY, velocityX) * (180 / Math.PI) + 90;
                    bRot += angleDifference(targetRotation, bRot) * 0.08;
                    const sway = Math.sin(time / 230) * 5;

                    wrapper.style.transform = `translate3d(${bX.toFixed(2)}px, ${bY.toFixed(2)}px, 0) rotate(${(bRot + sway).toFixed(2)}deg)`;
                    requestAnimationFrame(animateButterfly);
                }

                chooseButterflyTarget();
                requestAnimationFrame(animateButterfly);
            }
            createSingleButterfly();

            videoContainer.addEventListener('click', (e) => {
                if (cameraWidget.classList.contains('mini')) {
                    e.stopPropagation();

                    if (typeof fabric === 'undefined') {
                        alert('스티커 편집 기능을 불러오지 못했습니다. 인터넷 연결을 확인해주세요.');
                        return;
                    }

                    cameraWidget.className = 'fullscreen';
                    isPhotoBoothOpen = true;

                    setTimeout(() => {
                        const ratio = video.videoHeight && video.videoWidth ? video.videoHeight / video.videoWidth : 9 / 16;
                        const displayWidth = Math.min(CAMERA_MAX_WIDTH, window.innerWidth - CAMERA_SIDE_GAP);
                        const displayHeight = displayWidth * ratio;

                        videoContainer.style.height = displayHeight + 'px';

                        if (!fabricCanvas) {
                            fabricCanvas = new fabric.Canvas('overlay-canvas');
                        }
                        fabricCanvas.setWidth(displayWidth);
                        fabricCanvas.setHeight(displayHeight);
                    }, CAMERA_LAYOUT_DELAY_MS);
                }
            });

            byId('btn-close-camera').addEventListener('click', (e) => {
                e.stopPropagation();
                cameraWidget.style.display = 'none';
                cameraWidget.className = '';
                isPhotoBoothOpen = false;

                videoContainer.style.height = '100%';

                if (video.srcObject) {
                    video.srcObject.getTracks().forEach(track => track.stop());
                    video.srcObject = null;
                }
                cameraStreamActive = false;
                if (fabricCanvas) fabricCanvas.clear();
            });

            window.addSticker = function(imgId) {
                if (!fabricCanvas) return;
                const imgElement = byId(imgId);
                if (!imgElement) return;

                const imgInstance = new fabric.Image(imgElement, {
                    left: fabricCanvas.width / 2,
                    top: fabricCanvas.height / 2,
                    originX: 'center',
                    originY: 'center',
                    scaleX: 0.25,
                    scaleY: 0.25,
                    transparentCorners: false,
                    cornerColor: '#111',
                    cornerStrokeColor: '#fff',
                    borderColor: '#111',
                    cornerSize: 12,
                    padding: 10,
                    cornerStyle: 'circle'
                });
                fabricCanvas.add(imgInstance);
                fabricCanvas.setActiveObject(imgInstance);
            };

            function removeActiveSticker({ showEmptyMessage = false } = {}) {
                if (!fabricCanvas) return;
                const activeObject = fabricCanvas.getActiveObject();
                if (activeObject) {
                    fabricCanvas.remove(activeObject);
                } else if (showEmptyMessage) {
                    alert('삭제할 스티커를 먼저 클릭해서 선택해주세요.');
                }
            }

            function showCaptureFlash() {
                const flash = document.createElement('div');
                flash.style.position = 'fixed';
                flash.style.inset = '0';
                flash.style.backgroundColor = 'white';
                flash.style.zIndex = '9999';
                flash.style.pointerEvents = 'none';
                document.body.appendChild(flash);

                setTimeout(() => {
                    flash.style.transition = 'opacity 0.4s ease-out';
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 400);
                }, 50);
            }

            function downloadImage(dataUrl, filename) {
                const link = document.createElement('a');
                link.download = filename;
                link.href = dataUrl;
                document.body.appendChild(link);
                link.click();
                link.remove();
            }

            byId('delete-btn').addEventListener('click', function() {
                removeActiveSticker({ showEmptyMessage: true });
            });

            window.addEventListener('keydown', function(e) {
                if (e.key === 'Delete' || e.key === 'Backspace') {
                    removeActiveSticker();
                }
            });

            byId('capture-btn').addEventListener('click', function() {
                if (!fabricCanvas) return;
                fabricCanvas.discardActiveObject();
                fabricCanvas.renderAll();
                showCaptureFlash();

                try {
                    const ctx = tempCanvas.getContext('2d');
                    tempCanvas.width = fabricCanvas.width;
                    tempCanvas.height = fabricCanvas.height;
                    ctx.save();
                    ctx.translate(tempCanvas.width, 0);
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, 0, 0, tempCanvas.width, tempCanvas.height);
                    ctx.restore();

                    const fabricEl = fabricCanvas.lowerCanvasEl || fabricCanvas.getElement();
                    ctx.drawImage(fabricEl, 0, 0, tempCanvas.width, tempCanvas.height);
                    downloadImage(tempCanvas.toDataURL('image/png'), 'YerinB_Photo.png');
                } catch (e) {
                    console.error('저장 에러:', e);
                    alert('사진을 저장할 수 없습니다. 브라우저 보안 정책 때문에 차단될 수 있으니 localhost 또는 GitHub Pages에서 열어주세요.');
                }
            });
        });
    </script>
